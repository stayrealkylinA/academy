<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A+ Academy">
<meta name="theme-color" content="#fff8ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>A+ Academy</title>
<style>
:root{
  --ink:#2b2d42; --muted:#6b7280; --bg:#fff8ec; --card:#fff; --edge:#efd6a6;
  --coral:#ff6b6b; --sky:#3b9cf0; --sun:#ffc531; --leaf:#37b24d; --grape:#9775fa;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
body{background-image:radial-gradient(#ffe2b0 1.6px,transparent 1.6px);background-size:30px 30px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.zh{font-size:.68em;color:var(--muted);font-weight:700;margin-left:.25em}

/* chunky pressable */
.chunky{--sh:var(--edge);box-shadow:0 7px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.chunky:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;margin-bottom:8px}
.hello{font-size:clamp(26px,4.4vw,44px);font-weight:900}
.title{font-size:clamp(22px,3.6vw,38px);font-weight:900;text-align:center;flex:1;line-height:1.1}
.right{display:flex;gap:12px;align-items:center}
.stars{background:#fff;border-radius:999px;padding:8px 18px;font-size:clamp(20px,3vw,30px);font-weight:900;box-shadow:0 5px 0 var(--edge);white-space:nowrap}
.stars.bump{animation:pop .45s}
.round{width:64px;height:64px;border-radius:50%;background:#fff;font-size:30px;flex:none;display:grid;place-items:center}
.pill{background:#fff;border-radius:999px;padding:10px 16px;font-weight:900;font-size:16px}

/* home */
.home-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2.6vw,28px);padding-bottom:8px}
.tile{background:var(--c);color:var(--t,#fff);border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;--sh:var(--d);min-height:150px}
.tile-icon{font-size:clamp(54px,11vw,120px);line-height:1;font-weight:900;letter-spacing:-.02em}
.tile-en{font-size:clamp(24px,4.2vw,46px);font-weight:900;margin-top:6px}
.tile-zh{font-size:clamp(18px,3vw,32px);font-weight:800;opacity:.9}

/* modes */
.modes{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.modes button{background:#fff;border-radius:999px;padding:10px 22px;font-size:clamp(18px,2.6vw,24px);font-weight:900;--sh:var(--edge)}
.modes button.on{background:var(--ink);color:#fff;--sh:#11131f}
.modes button.on .zh{color:#d0d4e4}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.6vh,28px);overflow:auto;padding:8px 2px 14px}
.stage.scroll{justify-content:flex-start}
.prompt{display:flex;align-items:center;gap:14px;max-width:900px}
.prompt-text{font-size:clamp(24px,4.2vw,44px);font-weight:900;line-height:1.15}
.prompt-text .zh{display:block;margin:4px 0 0}
.speak{width:58px;height:58px;font-size:26px}

.scene{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(6px,1.4vw,14px);max-width:920px}
.obj{position:relative;font-size:clamp(40px,7vw,76px);line-height:1;background:#fff;border-radius:20px;padding:8px;animation:popin .35s both;box-shadow:0 4px 0 var(--edge)}
.obj.counted{background:#fff3bf}
.obj .n{position:absolute;top:-10px;right:-10px;background:var(--sky);color:#fff;font-size:18px;font-weight:900;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.obj.gone{opacity:.35}
.obj.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);font-size:1.1em;font-weight:900}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:300px;background:#fff;border-radius:24px;padding:10px 12px;box-shadow:0 5px 0 var(--edge)}
.group .obj{box-shadow:none;padding:2px;font-size:clamp(34px,5.4vw,58px)}
.group-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.group-num{font-size:clamp(28px,4vw,42px);font-weight:900}
.op{font-size:clamp(40px,7vw,72px);font-weight:900;color:var(--grape)}
.q{font-size:clamp(56px,9vw,96px);font-weight:900;color:var(--coral);min-width:1.2em;text-align:center}

.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,3vw,30px)}
.choice{width:clamp(108px,20vw,190px);aspect-ratio:1;background:#fff;border-radius:30px;font-size:clamp(54px,10vw,112px);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.choice small{font-size:.3em;color:var(--muted);margin-top:6px}
.choice svg{width:72%;height:72%}
.choice.right{background:#d3f9d8;--sh:#8ce99a;animation:pop .5s}
.choice.wrong{animation:shake .4s;opacity:.35}

/* grids for learn mode */
.grid{display:grid;gap:clamp(10px,1.8vw,18px);width:100%;max-width:1000px}
.grid.letters{grid-template-columns:repeat(auto-fill,minmax(clamp(68px,11vw,112px),1fr))}
.cell{aspect-ratio:1;border-radius:24px;background:var(--c);color:#fff;font-size:clamp(34px,6vw,60px);font-weight:900;--sh:rgba(0,0,0,.18);display:grid;place-items:center}
.section-h{font-size:clamp(22px,3.4vw,34px);font-weight:900;align-self:center;margin:4px 0 -4px}

/* overlay card */
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.45);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .2s}
.card{background:#fff;border-radius:40px;padding:24px 20px 20px;width:min(580px,100%);max-height:100%;overflow:auto;text-align:center;animation:popin .3s;box-shadow:0 12px 0 rgba(0,0,0,.12)}
.card-body{cursor:pointer}
.card-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.card-nav .round{background:var(--bg)}
.big-letter{font-size:clamp(96px,20vw,190px);font-weight:900;color:var(--coral);line-height:1}
.big-letter span{color:var(--sky);margin-left:.08em}
.big-emoji{font-size:clamp(80px,15vw,140px);line-height:1.15;animation:wiggle 1.2s ease-in-out .3s}
.word{font-size:clamp(34px,6vw,54px);font-weight:900}
.word b{color:var(--coral)}
.zh-word{font-size:clamp(28px,5vw,44px);font-weight:800;color:var(--muted)}
.big-num{font-size:clamp(110px,22vw,200px);font-weight:900;color:var(--sky);line-height:1}
.card .scene{margin-top:10px}
.card .obj{font-size:clamp(34px,6vw,56px)}

/* home: wide trace tile */
.tile.wide{grid-column:1/-1;flex-direction:row;gap:clamp(16px,3vw,40px)}
.tile-txt{display:flex;flex-direction:column;align-items:center}

/* tracing */
.stage{min-height:0}
.stage.trace{justify-content:flex-start;align-items:stretch;overflow:hidden;gap:clamp(8px,1.6vh,16px)}
.trace-top{display:flex;align-items:center;justify-content:center;gap:14px}
.trace-hint{font-size:clamp(24px,4vw,40px);font-weight:900;display:flex;align-items:center;gap:10px}
.trace-hint .emo{font-size:1.4em}
.board{flex:1;min-height:0;background:#fff;border-radius:32px;box-shadow:0 7px 0 var(--edge);overflow:hidden}
.board svg{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none}
.board .ln{stroke:#d9e6f5;stroke-width:1.2}
.board .ln-mid{stroke:#ffc9c9;stroke-dasharray:5 5}
.board .ln-base{stroke:#a5c8ee;stroke-width:1.6}
.board .ln-desc{stroke:#e6eef8}
.g-bed{fill:none;stroke:#eeeaf8;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.g-active{fill:none;stroke:#ddd2fb;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.g-dash{fill:none;stroke:#a99bd0;stroke-width:2.4;stroke-dasharray:1 6;stroke-linecap:round}
.fill{fill:none;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.ink{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;transition:opacity .5s}
.ink.fade{opacity:0}
.start{fill:#40c057;stroke:#fff;stroke-width:2.5}
.start.pulse{animation:dotpulse .6s 2;transform-box:fill-box;transform-origin:center}
.num{fill:#fff;font-size:12px;font-weight:900;text-anchor:middle;pointer-events:none}
.arrow{fill:#40c057;opacity:.85}
.ghost{fill:#ffc531;stroke:#fff;stroke-width:2;opacity:.9}
.board svg.done{animation:pop .6s}
.toolbar{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,14px);flex-wrap:wrap}
.crayons{display:flex;gap:8px;padding:0 6px}
.crayon{width:42px;height:42px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 3px 0 var(--edge)}
.crayon.on{outline:4px solid var(--ink);outline-offset:1px}
#tNext.ready{background:#40c057;animation:breathe 1s ease-in-out infinite}
.picker{width:min(760px,100%)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.pick-grid.words{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pick{position:relative;background:var(--bg);border-radius:18px;padding:10px 6px;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.pick.cur{background:#e5dbff}
.pick i{position:absolute;top:-6px;right:-4px;font-size:16px;font-style:normal}
/* write-by-yourself */
.board{position:relative}
.writing .guide{display:none}
.trace-hint .model{height:clamp(54px,8vh,80px);width:auto;flex:none;background:#fff;border-radius:14px;box-shadow:0 4px 0 var(--edge)}
.model path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.slots{display:flex;gap:8px}
.slot{width:clamp(48px,7vw,70px);height:clamp(48px,7vw,70px);border-radius:50%;background:#fff;border:3px dashed #d8cdb6;display:grid;place-items:center;font-size:20px;color:#c4b89e;font-weight:900}
.slot.now{border:3px solid var(--grape);color:var(--grape);animation:breathe 1.2s ease-in-out infinite}
.slot .stamps{display:flex;flex-wrap:wrap;justify-content:center;max-width:90%}
.slot .stamp{font-size:clamp(13px,2vw,18px);width:auto;height:auto;border:0;box-shadow:none;animation:none;transform:none;background:none;color:#e03131}
.stamp{display:inline-grid;place-items:center;width:clamp(70px,11vw,110px);height:clamp(70px,11vw,110px);border:6px solid #e03131;border-radius:50%;color:#e03131;font-size:clamp(40px,6vw,64px);background:rgba(255,245,245,.9);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px #e03131;transform:rotate(-12deg);opacity:0;animation:stampin .35s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp:nth-child(2){animation-delay:.28s}.stamp:nth-child(3){animation-delay:.56s}
.stamp-fx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:rgba(255,255,255,.55)}
.stamp-fx>div{text-align:center}
.stamp-fx .stamps{display:flex;gap:14px;justify-content:center}
.stamp-fx p{font-size:clamp(28px,4.5vw,46px);font-weight:900;margin:14px 0 0}
.stamp-fx.summary{background:rgba(255,255,255,.85)}
.stamp-fx .big{font-size:clamp(54px,9vw,96px)}
.stamp-fx .big small{font-size:.45em;color:var(--muted)}
.stamp-fx .sub{font-size:clamp(16px,2.2vw,22px);color:var(--muted)}
.ok-btn{background:#40c057;color:#fff;border-radius:999px;padding:12px 22px;font-size:clamp(20px,2.8vw,26px);font-weight:900;--sh:#2b8a3e}
.ok-btn .zh{color:#e6fcf5}
.ok-btn[hidden]{display:none}
.ok-btn.ready{animation:breathe 1s ease-in-out infinite}
.pick i.bst{color:#e03131;font-size:13px;letter-spacing:-1px}
.slot .stamp{opacity:1}
/* letter cycle steps */
.steps{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 4px 0 var(--edge)}
.chip{font-size:clamp(18px,2.6vw,26px);font-weight:900;padding:2px 10px;border-radius:999px;color:#b9b0a0}
.chip.now{background:var(--grape);color:#fff}
.chip.ok{color:#2b8a3e}
.chip.ok::before{content:"✓ "}
.arr{color:#c9bfae;font-weight:900}
/* star flying into the counter */
.flystar{position:fixed;z-index:40;font-size:44px;margin:-26px 0 0 -26px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.4,.6,1)}
/* piggy bank */
.stage.bank{gap:clamp(8px,1.8vh,18px);text-align:center}
.piggy{font-size:clamp(90px,16vw,160px);line-height:1;animation:wiggle 1.4s ease-in-out}
.bank-money{font-size:clamp(56px,10vw,100px);font-weight:900;color:#2b8a3e;line-height:1}
.bank-rule{font-size:clamp(20px,3vw,28px);font-weight:900;color:var(--muted)}
.bills{font-size:clamp(28px,4vw,40px);min-height:1em;max-width:700px}
.meter{position:relative;width:min(560px,90%);height:44px;background:#fff;border-radius:999px;box-shadow:0 4px 0 var(--edge);overflow:hidden}
.meter div{height:100%;background:linear-gradient(90deg,#ffd43b,#fab005);border-radius:999px}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px}
.bank-next{font-size:clamp(18px,2.6vw,24px);font-weight:800}
.bank-next .zh{display:block}
.parent-btn{font-size:16px;margin-top:8px}
.stage.habits{gap:14px}
.mood-card,.habit-head,.habit-grid{width:min(900px,100%)}
.mood-card{background:#fff;border-radius:30px;box-shadow:0 7px 0 var(--edge);padding:14px 16px;text-align:center}
.mood-card h3,.habit-head h3{margin:4px 0 10px;font-size:clamp(20px,3vw,28px)}
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.4vw,14px)}
.mood{background:var(--bg);border-radius:22px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:clamp(14px,2vw,18px)}
.mood span{font-size:clamp(48px,8.5vw,78px);line-height:1.1}
.mood small{color:var(--muted);font-size:.85em}
.mood.on{background:#ffe066;outline:4px solid var(--ink)}
.mood-reply{font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:10px 0 2px;min-height:1em}
.mood-reply .zh{display:block}
.habit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.habit-head h3 b{color:#0ca678;margin-left:6px}
.parent-btn.unlocked{background:#ffe066}
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,40vw,420px),1fr));gap:12px}
.habit{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;text-align:left}
.habit .h-e{font-size:clamp(34px,5vw,46px)}
.habit .h-t{flex:1;font-weight:900;font-size:clamp(16px,2.3vw,21px);display:flex;flex-direction:column}
.habit .h-t small{color:var(--muted);font-size:.85em}
.habit .h-c{font-size:30px;min-width:34px;text-align:center}
.habit.on{background:#d3f9d8;--sh:#8ce99a}
.rec .mood-cell{font-size:1.4em}
.rec .time-cell small{display:block;color:var(--muted);font-size:.78em}
.modes{flex-wrap:wrap;align-items:center}
.write-strip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--edge);font-size:clamp(13px,1.7vw,16px)}
.write-strip b{color:var(--grape)}
.ws{color:#b9b0a0;font-weight:800}
.ws small{margin-left:3px;font-size:.8em}
.ws.ok{color:#2b8a3e}
/* icons */
.ic{width:58%;height:58%;display:block}
.round{color:var(--ink)}
.round.ready,#tNext.ready{color:#fff}
.pick .ic,.card-nav .ic{width:60%;height:60%}
.tile-icon svg{width:clamp(76px,11vw,140px);height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
/* home: 4 tasks on top, Piggy Bank bar at the bottom */
.home-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr auto}
.home-grid .tile{min-height:0;padding:14px 8px;text-align:center}
.home-grid .tile-en{font-size:clamp(20px,2.8vw,32px);line-height:1.1}
.home-grid .tile-zh{font-size:clamp(15px,2vw,22px)}
.tile.wide{min-height:0;padding:10px 24px;justify-content:center}
.tile.wide .tile-icon svg{width:clamp(64px,8vw,92px)}
.tile.wide .tile-txt{align-items:flex-start}
.tile-sub{font-size:clamp(14px,1.8vw,18px);font-weight:800;margin-top:2px;opacity:.95}
@media (max-width:900px){ .home-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr auto} }
/* cash-out schedule */
.cash-day{font-size:clamp(14px,1.9vw,17px);color:var(--muted);font-weight:700}
.cash-day b{color:var(--ink)} .cash-day b.due,.gate-sub b.due{color:#2b8a3e}
.sched .pill{font-size:16px;padding:10px 14px}
.sched .pill.on{background:var(--ink);color:#fff}
.sched .pill.on .zh{color:#d0d4e4}
.gate-opts .pill[disabled]{opacity:.5;font-size:16px}
.g-show,.trace-hint{cursor:pointer}
.teach-head{font-size:clamp(20px,3vw,28px);font-weight:900}
.teach-head b{color:var(--grape);margin-left:8px}
.ic-txt{font-size:15px;font-weight:900;letter-spacing:-.5px}
.round.mic{background:#fff0f6;color:#d6336c}
.round.mic.listening{background:#fa5252;color:#fff;animation:breathe .8s ease-in-out infinite}
input{-webkit-user-select:text;user-select:text}
.hello{display:flex;align-items:center;gap:12px;text-align:left}
.avatar{width:clamp(52px,7vw,64px);height:clamp(52px,7vw,64px);flex:none;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.avatar.empty{display:grid;place-items:center;background:#fff;border-radius:50%;font-size:32px}
.avatar.big{width:clamp(200px,34vw,300px);height:auto;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.stage.onboard{justify-content:center}
.ob-card{background:#fff;border-radius:40px;box-shadow:0 10px 0 var(--edge);padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:min(560px,100%)}
.ob-card.wide{width:min(760px,100%)}
.ob-big{font-size:80px;line-height:1;animation:wiggle 1.4s ease-in-out infinite}
.name-in{font:inherit;font-size:clamp(28px,4.6vw,40px);font-weight:900;text-align:center;width:min(380px,100%);padding:12px 18px;border-radius:24px;border:4px solid #e9dcc3;background:var(--bg);color:var(--ink);outline:none}
.name-in:focus{border-color:var(--grape)}
.buddy-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:100%}
.buddy{font-size:clamp(36px,6vw,56px);background:var(--bg);border-radius:22px;padding:6px 0}
.buddy.on{background:#ffe066;outline:4px solid var(--ink)}
.crayons.big .crayon{width:50px;height:50px}
.self-pad{width:min(380px,74vw);height:min(380px,74vw);border-radius:50%}
.self-ink{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.draw-card .toolbar{flex-wrap:wrap}
.skip{color:var(--muted);font-weight:800;font-size:15px;text-decoration:underline}
.making{font-size:72px;animation:wiggle 1s ease-in-out infinite}
.prof-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}

<body>
<div id="app"></div>
<script>
/* ---------- storage (safe) ---------- */
// saved progress; falls back to memory (for this session) if the browser blocks saving
const memStore = {};
const raw = {
  get(k){
    try{ const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); }catch(e){}
    return k in memStore ? JSON.parse(memStore[k]) : null;
  },
  set(k, v){ memStore[k] = JSON.stringify(v); try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// each kid has a profile; everything they earn is saved under their own id
// (the first kid uses the id 'auston' so progress saved before profiles existed is kept)
let profileId = raw.get('academy.current') || 'auston';
const profileIds = () => { const l = raw.get('academy.profiles') || []; return l.includes(profileId) ? l : [...l, profileId]; };
const store = {
  get(k, d){ const v = raw.get(profileId + '.' + k); return v == null ? d : v; },
  set(k, v){ raw.set(profileId + '.' + k, v); }
};
const me = () => store.get('profile', null);   // {name, animal, color, strokes}
/* stars from other iPads (moved by AirDrop) are kept as one snapshot per iPad,
   so sending again replaces the old snapshot instead of counting it twice */
const deviceId = raw.get('academy.device') || (() => { const id = Math.random().toString(36).slice(2, 6).toUpperCase(); raw.set('academy.device', id); return id; })();
const remotes = () => store.get('remotes', {});   // deviceId -> {at, stars, daylog, history}
const remoteStars = () => Object.values(remotes()).reduce((a, r) => a + (r.stars || 0), 0);
const maxN = (x, y) => x == null ? y : y == null ? x : Math.max(x, y);
function mergeDay(a, b){
  if (!a) return JSON.parse(JSON.stringify(b)); if (!b) return a;
  const time = Object.assign({}, a.time); Object.entries(b.time || {}).forEach(([k, v]) => { time[k] = (time[k] || 0) + v; });
  const bonus = Object.assign({}, a.bonus); Object.entries(b.bonus || {}).forEach(([k, v]) => { bonus[k] = (bonus[k] || 0) + v; });
  return {stars: (a.stars || 0) + (b.stars || 0), trace: (a.trace || 0) + (b.trace || 0),
    words: maxN(a.words, b.words), math: maxN(a.math, b.math), paid: (a.paid || 0) + (b.paid || 0),
    habits: [...new Set([...(a.habits || []), ...(b.habits || [])])], mood: a.mood || b.mood,
    tw: Object.assign({}, a.tw, b.tw), time, bonus, said: [...new Set([...(a.said || []), ...(b.said || [])])]};
}
// every iPad's days together, for the Piggy Bank record
function allDaylog(){
  const out = JSON.parse(JSON.stringify(store.get('daylog', {})));
  Object.values(remotes()).forEach(r => Object.entries(r.daylog || {}).forEach(([k, e]) => { out[k] = mergeDay(out[k], e); }));
  return out;
}
function allHistory(){
  const h = store.get('bank.history', []).map(x => ({...x}));
  Object.entries(remotes()).forEach(([id, r]) => (r.history || []).forEach(x => h.push({...x, dev: id})));
  return h.sort((a, b) => a.t - b.t);
}
// `stars` is the total shown to him (this iPad + other iPads); only this iPad's part is saved locally
let stars = store.get('stars', 0) + remoteStars();
const saveStars = () => store.set('stars', stars - remoteStars());
let lang  = store.get('lang', 'both'); // both | en | zh

/* ---------- speech ---------- */

function tone(freqs, dur, type, vol){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur*1.8);

      o.start(t); o.stop(t + dur*2);
    });

const EMO_RE = /[0-9#*]️?⃣|\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*/gu;
const EMO_TEST = new RegExp(EMO_RE.source, 'u');
const EMO_SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'OPTION', 'SELECT', 'TITLE']);
const EMO_FAILED = new Set();
function emojify(root){
  if (!root || (root.nodeType !== 1 && root.nodeType !== 11)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => {
    const el = n.parentElement;
    if (!el || EMO_SKIP.has(el.nodeName) || el.closest('svg,.no3d')) return NodeFilter.FILTER_REJECT;
    return EMO_TEST.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const txt = n.nodeValue; let last = 0, frag = null;
    txt.replace(EMO_RE, (m, off) => {
      const f = EMOJI_3D[m.replace(/️/g, '')]; if (!f || EMO_FAILED.has(f)) return m;
      frag = frag || document.createDocumentFragment();
      if (off > last) frag.appendChild(document.createTextNode(txt.slice(last, off)));
      const img = document.createElement('img');
      img.className = 'e3d'; img.src = 'emoji/' + f + '.png'; img.alt = m; img.draggable = false;
      // offline + not saved yet: show the plain emoji, and don't try that picture again this session
      img.onerror = () => { EMO_FAILED.add(f); const t = document.createElement('span'); t.className = 'no3d'; t.textContent = m; img.replaceWith(t); };
      frag.appendChild(img); last = off + m.length; return m;
    });
    if (frag){ if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last))); n.replaceWith(frag); }
  });
}
/* ---------- language on screen ----------
   EN + 中文: everything. EN: Chinese text hidden. 中文: English labels hidden, but the learning
   content (words, letters, numbers - anything English without a Chinese partner) stays.
   Text is marked once (.L-zh = Chinese bit, .L-en = English label); a class on <body> shows/hides. */
const HAS_CJK = /[㐀-鿿豈-﫿]/, HAS_LAT = /[A-Za-z]/;
const CJK_RUN = /[㐀-鿿豈-﫿　-〿＀-￯]+/g;
const LAT_RUN = /[A-Za-z][A-Za-z'’.\-!?,&]*(?:[ \t]+[A-Za-z][A-Za-z'’.\-!?,&]*)*/g;
const pureZh = el => { const t = el.textContent; return HAS_CJK.test(t) && !HAS_LAT.test(t); };
function wrapIn(cls, text){ const sp = document.createElement('span'); sp.className = cls; sp.textContent = text; return sp; }
function splitLatin(frag, text){
  let last = 0;
  text.replace(LAT_RUN, (m, off) => {
    if (off > last) frag.appendChild(document.createTextNode(text.slice(last, off)));
    frag.appendChild(wrapIn('L-en', m)); last = off + m.length; return m;
  });
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
}
function langify(root){
  if (!root || (root.nodeType !== 1 && root.nodeType !== 11)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => {
    const el = n.parentElement;
    if (!el || EMO_SKIP.has(el.nodeName) || el.closest('svg,.L-en,.L-zh,.no-lang')) return NodeFilter.FILTER_REJECT;
    return (HAS_CJK.test(n.nodeValue) || HAS_LAT.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const t = n.nodeValue, el = n.parentElement, hz = HAS_CJK.test(t), la = HAS_LAT.test(t);
    if (hz && la){                       // "today 今日" in one piece: split it
      const frag = document.createDocumentFragment(); let last = 0;
      t.replace(CJK_RUN, (m, off) => {
        if (off > last) splitLatin(frag, t.slice(last, off));
        frag.appendChild(wrapIn('L-zh', m)); last = off + m.length; return m;
      });
      if (last < t.length) splitLatin(frag, t.slice(last));
      n.replaceWith(frag);
    } else if (hz){                      // Chinese only
      n.replaceWith(wrapIn('L-zh', t));
    } else if ([...el.children].some(pureZh)){   // English label with a Chinese partner next to it
      n.replaceWith(wrapIn('L-en', t));
    }
  });
}
function applyLang(){
  document.body.classList.remove('lang-both', 'lang-en', 'lang-zh');
  document.body.classList.add('lang-' + lang);
}
applyLang();
new MutationObserver(muts => {
  for (const m of muts) for (const n of m.addedNodes){
    const el = n.nodeType === 1 ? n : (n.nodeType === 3 ? n.parentElement : null);
    if (el){ langify(el); emojify(el); }
  }
}).observe(document.documentElement, {childList: true, subtree: true});

function nearbyNumbers(ans, count, lo, hi){
  const set = new Set([ans]);
  let spread = 1;
  while (set.size < count){
    const n = ans + (Math.random()<.5?-1:1) * (1 + rand(spread+1));
    if (n >= lo && n <= hi) set.add(n);
    spread = Math.min(spread+1, 4);
  }
  return shuffle([...set]);
}

    later(() => cheer(`💵 $${stars / STAMPS_PER_DOLLAR}`, `${stars} stars! That's ${stars / STAMPS_PER_DOLLAR} dollar${stars > STAMPS_PER_DOLLAR ? 's' : ''} in your piggy bank!`, `${stars}颗星星！存钱罐里有${stars / STAMPS_PER_DOLLAR}块钱啦！`), 900);
}
function addStar(fromEl){ bumpStars(1); burst(fromEl); }
// a star flies from an element (e.g. a stamp) up into the counter, then counts
function flyStar(fromEl, delay = 0){
  setTimeout(() => {
    const target = document.getElementById('starCount');
    if (!target || !fromEl.isConnected){ bumpStars(1); return; }
    const r = fromEl.getBoundingClientRect(), t = target.parentElement.getBoundingClientRect();
    const x0 = r.left + r.width/2, y0 = r.top + r.height/2;
    const f = document.createElement('span');
    f.className = 'flystar'; f.textContent = '⭐';
    f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
    document.body.appendChild(f);
    void f.getBoundingClientRect();
    f.style.transform = `translate(${t.left + 24 - x0}px, ${t.top + t.height/2 - y0}px) scale(.55)`;
    setTimeout(() => { f.remove(); bumpStars(1); tone([988], 0.05, 'triangle', 0.08); }, 750);
  }, delay);
}
function burst(el){
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = pick(['⭐','✨','🎉','💛','🌟']);
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*150;
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}

/* ---------- kids' profiles: name, buddy, self-portrait avatar ---------- */
const BUDDIES = ['🐶','🐱','🦊','🐼','🐨','🐯','🦁','🐰','🐸','🐵','🦄','🐲'];
const AV_COLORS = ['#9775fa','#ff6b6b','#4dabf7','#40c057','#fcc419','#f783ac','#ff922b','#20c997'];
const DRAW_COLORS = ['#343a40','#f03e3e','#1c7ed6','#2f9e44','#f59f00','#e64980','#7048e8','#8d5524'];
// smooth a hand-drawn line (Chaikin), so the avatar looks soft and cute
function smoothPts(pts, rounds = 2){
  let out = pts;
  for (let r = 0; r < rounds && out.length > 2; r++){
    const n = [out[0]];
    for (let i = 0; i < out.length - 1; i++){
      const [x0, y0] = out[i], [x1, y1] = out[i + 1];
      n.push([x0 * .75 + x1 * .25, y0 * .75 + y1 * .25], [x0 * .25 + x1 * .75, y0 * .25 + y1 * .75]);
    }
    n.push(out[out.length - 1]); out = n;
  }
  return out;
}
let avatarSeq = 0;
// the avatar: their drawing, smoothed and fitted into a coloured circle, outlined, with sparkles + their buddy
function avatarSVG(pr, cls = 'avatar'){
  if (!pr) return `<span class="${cls} empty">🙂</span>`;
  const c = pr.color || '#9775fa', strokes = (pr.strokes || []).filter(s => s.pts.length);
  let inner = '';
  if (strokes.length){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    strokes.forEach(s => s.pts.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
    const sc = 118 / Math.max(x1 - x0, y1 - y0, 20), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const ds = strokes.map(s => ({c: s.c, d: (s.pts.length === 1 ? pathD([s.pts[0], [s.pts[0][0] + .1, s.pts[0][1]]]) : pathD(smoothPts(s.pts)))}));
    inner = `<g transform="translate(100 96) scale(${sc.toFixed(3)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})" stroke-linecap="round" stroke-linejoin="round" fill="none">
      ${ds.map(s => `<path d="${s.d}" stroke="#fff" stroke-width="${(15 / sc).toFixed(2)}"/>`).join('')}
      ${ds.map(s => `<path d="${s.d}" stroke="${s.c}" stroke-width="${(8 / sc).toFixed(2)}"/>`).join('')}</g>`;
  } else {
    inner = `<text x="100" y="128" font-size="92" text-anchor="middle">${pr.animal || '🙂'}</text>`;
  }
  const id = 'av' + (++avatarSeq);
  return `<svg class="${cls}" viewBox="0 0 200 200" aria-hidden="true">
    <defs><clipPath id="${id}"><circle cx="100" cy="100" r="84"/></clipPath></defs>
    <circle cx="100" cy="100" r="98" fill="${c}"/>
    <circle cx="100" cy="100" r="84" fill="#fff"/>
    <circle cx="100" cy="100" r="84" fill="${c}" opacity=".16"/>
    <g clip-path="url(#${id})">${inner}</g>
    <path d="M30 34l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffd43b"/><path d="M168 26l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#ffd43b"/>
    ${strokes.length ? `<circle cx="160" cy="160" r="30" fill="#fff" stroke="${c}" stroke-width="6"/><text x="160" y="173" font-size="36" text-anchor="middle">${pr.animal || ''}</text>` : ''}
  </svg>`;
}
// a traceable version of the name (letters only, "Auston" style), or null
function nameWord(n){
  const w = String(n || '').replace(/[^A-Za-z]/g, '');

}

/* ---------- birthday: year / month / day ---------- */
const MONTHS = [['Jan','一月'],['Feb','二月'],['Mar','三月'],['Apr','四月'],['May','五月'],['Jun','六月'],
                ['Jul','七月'],['Aug','八月'],['Sep','九月'],['Oct','十月'],['Nov','十一月'],['Dec','十二月']];
function birthdayPicker(bd){
  const [y, m, d] = (bd || '').split('-').map(Number), now = new Date().getFullYear();
  const opt = (v, label, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${label}</option>`;
  return `<div class="bday-pick">
    <label>Year 年<select id="bdY">${opt('', '—', !y)}${Array.from({length: 16}, (_, i) => now - i).map(v => opt(v, v, v === y)).join('')}</select></label>
    <label>Month 月<select id="bdM">${opt('', '—', !m)}${MONTHS.map(([en, zh], i) => opt(i + 1, `${i + 1} · ${en} ${zh}`, i + 1 === m)).join('')}</select></label>
    <label>Day 日<select id="bdD">${opt('', '—', !d)}${Array.from({length: 31}, (_, i) => opt(i + 1, i + 1, i + 1 === d)).join('')}</select></label>
  </div>`;
}
// read the picker: 'YYYY-MM-DD', or null if something is missing / not a real date (e.g. Feb 30)
function readBirthday(){
  const y = +document.getElementById('bdY').value, m = +document.getElementById('bdM').value, d = +document.getElementById('bdD').value;
  if (!y || !m || !d) return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1 || dt > new Date()) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function ageOf(bd){
  if (!bd) return null;
  const [y, m, d] = bd.split('-').map(Number), now = new Date();
  return now.getFullYear() - y - ((now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) ? 1 : 0);
}
const bdayText = bd => { if (!bd) return ''; const [y, m, d] = bd.split('-').map(Number); return `${MONTHS[m - 1][0]} ${d}, ${y} · ${ageOf(bd)} yrs ${ageOf(bd)}岁`; };
// ask (or change) the birthday of the kid using the app
function birthdayAsk(onDone){

// on the home screen: ask once if the birthday is missing; celebrate on the day
function birthdayCheck(){
  const pr = me(); if (!pr) return;
  if (!pr.birthday){ if (!birthdayAsked){ birthdayAsked = true; later(() => birthdayAsk(), 900); } return; }

}

/* parent: listen to the voices on this iPad and pick the most natural one */
function voicePanel(){
  const ov = document.createElement('div'); ov.className = 'overlay';
  const name = (me() || {}).name || 'Auston';
  const SAMPLE = {'en-US': `Hi ${name}! Great job! Let's trace the letter A.`, 'zh-CN': `你好，${name}！做得真好！我们来描一描字母A。`};
  const quality = v => /premium/i.test(v.name) ? '✨ Premium' : /enhanced|neural|natural/i.test(v.name) ? 'Enhanced' : 'Standard';
  const test = (code, v) => {
    if (!hasSpeech) return;
    stopSpeech();
    const u = new SpeechSynthesisUtterance(SAMPLE[code]); u.lang = code; u.voice = v;
    u.rate = code === 'zh-CN' ? 0.88 : 0.92; u.pitch = 1; speechSynthesis.speak(u);
  };
  const section = (code, title) => {
    const list = voicesFor(code).filter(v => voiceScore(v, code) > -100).slice(0, 10), cur = pickVoice(code);   // no joke voices
    return `<p class="vp-h">${title}</p><div class="vp-list">${list.length ? list.map((v, i) => `
      <div class="vp-row ${cur && v.name === cur.name ? 'on' : ''}">
        <button class="vp-pick" data-pick="${code}" data-i="${i}"><b>${esc(v.name)}</b><small>${quality(v)} · ${v.lang}</small></button>
        <button class="pill chunky" data-test="${code}" data-i="${i}">▶ Test 试听</button></div>`).join('')
      : '<p class="no">No voices found yet. 还没有找到声音。</p>'}</div>`;
  };
  const draw = () => {
    ov.innerHTML = `<div class="card gate voice-panel"><p class="gate-q">🔊 Voice<br><small>声音</small></p>
      ${section('en-US', 'English voice 英文声音')}
      ${section('zh-CN', 'Chinese voice 中文声音')}
      <div class="vp-tip"><b>Most natural voices (free from Apple):</b> iPad <b>Settings → Accessibility → Spoken Content → Voices</b>.
        English → download <b>Ava (Premium)</b> or <b>Zoe (Premium)</b>. Chinese (China mainland) → <b>Lilian (Premium)</b> or <b>Tingting (Enhanced)</b>.
        Then come back here and pick it.<br>最自然的声音：设置 → 辅助功能 → 朗读内容 → 声音，下载“高级”或“增强”声音，然后回到这里选择。</div>
      <div class="gate-opts"><button class="pill chunky gate-ok" data-x>Done 完成</button></div></div>`;
  };
  ov.onclick = e => {
    const pk = e.target.closest('[data-pick]'), ts = e.target.closest('[data-test]');
    const b = pk || ts;
    if (b){
      const code = b.dataset.pick || b.dataset.test, v = voicesFor(code)[+b.dataset.i];
      if (!v) return;
      if (pk){ raw.set('academy.voice.' + code, v.name); draw(); }
      test(code, v); return;
    }
    if (e.target === ov || e.target.closest('[data-x]')){ stopSpeech(); ov.remove(); }
  };
  draw(); document.body.appendChild(ov);
  if (hasSpeech && !voices.length){ loadVoices(); setTimeout(() => { loadVoices(); draw(); }, 600); }
}

/* parent: see every account on this iPad and delete the ones not in use */
function kidInfo(id){
  const log = raw.get(id + '.daylog') || {}, days = Object.keys(log).sort();
  return {pr: raw.get(id + '.profile'), stars: raw.get(id + '.stars') || 0, last: days[days.length - 1] || null, daysUsed: days.length};
}
function lastUsedText(last){
  if (!last) return 'never used 从未使用';
  const d = Math.round((new Date(isoDay()) - new Date(last)) / 86400000);
  return d <= 0 ? 'used today 今天用过' : d === 1 ? 'last used yesterday 昨天用过' : `last used ${d} days ago ${d}天前用过`;
}
function deleteKid(id){
  const pre = id + '.';
  try { Object.keys(localStorage).filter(k => k.startsWith(pre)).forEach(k => localStorage.removeItem(k)); } catch(e){}
  Object.keys(memStore).filter(k => k.startsWith(pre)).forEach(k => delete memStore[k]);
  const rest = (raw.get('academy.profiles') || []).filter(x => x !== id);
  raw.set('academy.profiles', rest);
  if (id === profileId) raw.set('academy.current', rest[0] || ('kid' + Date.now()));
  return id === profileId || !rest.length;   // true: the app has to restart
}
function manageKids(){
  const ov = document.createElement('div'); ov.className = 'overlay';
  let confirmId = null;
  const draw = () => {
    const ids = profileIds();
    ov.innerHTML = `<div class="card gate prof-manage"><p class="gate-q">Kids on this iPad<br><small>这台iPad上的账号</small></p>
      <div class="pm-list">${ids.map(id => {
        const k = kidInfo(id), stale = !k.pr || !k.last || (new Date(isoDay()) - new Date(k.last)) / 86400000 > 30;
        const name = k.pr ? esc(k.pr.name) : 'Not set up 未设置';
        if (id === confirmId) return `<div class="pm-row confirm">
          <span class="pm-q">${k.pr ? `Delete <b>${name}</b> and all of their ⭐ ${k.stars} stars, records and goals? This can't be undone.<br>删除${name}和所有星星、记录、目标？无法恢复。`
            : `Delete this unfinished account? 删除这个未设置的账号？`}</span>

          <button class="pill chunky" data-del="${id}">🗑 Delete 删除</button></div>`;
      }).join('')}</div>

      <div class="gate-opts"><button class="pill chunky gate-ok" data-x>Done 完成</button></div></div>`;
  };
  ov.onclick = e => {

    if (d){ confirmId = d.dataset.del; sfx.pop(); draw(); return; }

// "not behaving well": take stars away (never below 0); unticking gives back exactly what was taken
function loseStars(n){
  const lost = Math.min(n, stars);
  stars -= lost; saveStars();
  const s = document.getElementById('starCount');
  if (s){ s.textContent = stars; s.parentElement.classList.remove('bump'); void s.offsetWidth; s.parentElement.classList.add('bump'); }
  return lost;
}
function giveBack(n){
  stars += n; saveStars();
  const s = document.getElementById('starCount'); if (s) s.textContent = stars;
}
function minusFloat(el, n){
  const r = el.getBoundingClientRect(), f = document.createElement('span');
  f.className = 'minus-float'; f.textContent = `−${n} ⭐`;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height / 2) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1400);
}
function takeStar(){   // a parent un-ticks a habit: give that star back
  stars = Math.max(0, stars - 1); saveStars();
  logToday(e => { e.stars = Math.max(0, e.stars - 1); });
  const s = document.getElementById('starCount'); if (s) s.textContent = stars;
}

/* cash-out schedule chosen by a parent: weekly, every 10 days, or monthly */
const SCHEDULES = {
  week:  {days: 7,   en: 'Every week',    zh: '每周'},
  d10:   {days: 10,  en: 'Every 10 days', zh: '每10天'},
  month: {months: 1, en: 'Every month',   zh: '每月'},
};
const cashSched = () => SCHEDULES[store.get('bank.sched', 'week')] ? store.get('bank.sched', 'week') : 'week';
function nextCashDate(){
  const h = allHistory();
  let start = store.get('bank.start', null);
  if (!start){ start = Date.now(); store.set('bank.start', start); }
  const base = new Date(h.length ? h[h.length - 1].t : start);
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  const sc = SCHEDULES[cashSched()];
  if (sc.months) d.setMonth(d.getMonth() + sc.months); else d.setDate(d.getDate() + sc.days);
  return d;
}
const cashDue = () => Date.now() >= nextCashDate().getTime();
function cashDayText(){
  const d = nextCashDate(), sc = SCHEDULES[cashSched()];
  if (cashDue()) return `📅 ${sc.en} · <b class="due">Cash-out day is today! 今天可以兑换！</b>`;
  const days = Math.ceil((d - Date.now()) / 86400000);
  return `📅 ${sc.en} ${sc.zh} · next cash-out 下次兑换: <b>${d.toLocaleDateString(undefined, {weekday: 'short', month: 'numeric', day: 'numeric'})}</b> (${days} day${days === 1 ? '' : 's'} · ${days}天)`;
}

function exportData(){
  const devices = JSON.parse(JSON.stringify(remotes()));
  devices[deviceId] = {at: Date.now(), stars: store.get('stars', 0), daylog: store.get('daylog', {}), history: store.get('bank.history', [])};
  return {app: 'academy', v: 1, from: deviceId, name: (me() || {}).name || '', profile: me(), exportedAt: Date.now(), devices};
}
function importData(d){
  const rs = remotes();
  Object.entries(d.devices || {}).forEach(([id, snap]) => {
    if (id === deviceId) return;                                   // this iPad's own data is already here
    if (!rs[id] || (snap.at || 0) >= (rs[id].at || 0)) rs[id] = snap; // newer snapshot replaces older one
  });
  store.set('remotes', rs);
  if (!me() && d.profile) store.set('profile', d.profile);
  stars = store.get('stars', 0) + remoteStars();
}

function goalEditor(g, onDone){
  const ov = document.createElement('div'); ov.className = 'overlay';
  let name = g ? g.name : '', pic = g ? g.e : GOAL_PICS[0], target = g ? g.target : 10, delArmed = false;
  const draw = () => {
    ov.innerHTML = `<div class="card gate goal-edit">
      <p class="gate-q">${g ? 'Edit goal' : 'New goal'}<br><small>${g ? '修改目标' : '新目标'}</small></p>
      <input class="g-name" maxlength="30" placeholder="e.g. Lego fire truck 例如：乐高消防车" value="${esc(name)}">
      <div class="pic-pick">${GOAL_PICS.map(e => `<button class="${e === pic ? 'on' : ''}" data-p="${e}">${e}</button>`).join('')}</div>
      <div class="gate-amt"><button class="round chunky" data-d="-5">−5</button><button class="round chunky" data-d="-1">−1</button><b>$${target}</b><button class="round chunky" data-d="1">+1</button><button class="round chunky" data-d="5">+5</button></div>
      <div class="gate-opts">
        ${g ? `<button class="pill chunky" data-del>${delArmed ? 'Tap again to delete 再点一次删除' : '🗑 Delete 删除'}</button>` : ''}
        <button class="pill chunky" data-x>Cancel 取消</button>
        <button class="pill chunky gate-ok" data-save>Save 保存</button></div></div>`;
    const inp = ov.querySelector('.g-name');
    inp.oninput = () => { name = inp.value; };
  };
  ov.onclick = e => {
    const pb = e.target.closest('[data-p]'), db = e.target.closest('[data-d]');
    if (pb){ pic = pb.dataset.p; sfx.pop(); draw(); return; }
    if (db){ target = Math.max(1, Math.min(500, target + +db.dataset.d)); sfx.pop(); draw(); return; }
    if (e.target.closest('[data-save]')){
      if (!name.trim()){ ov.querySelector('.g-name').focus(); return; }
      const goals = getGoals();
      if (g){ Object.assign(goals.find(x => x.id === g.id), {name: name.trim(), e: pic, target}); }
      else goals.push({id: 'g' + Date.now().toString(36), name: name.trim(), e: pic, target, saved: 0, createdAt: Date.now()});
      setGoals(goals); sfx.yay(); ov.remove(); onDone(); return;
    }
    if (e.target.closest('[data-del]')){
      if (!delArmed){ delArmed = true; draw(); return; }
      setGoals(getGoals().filter(x => x.id !== g.id)); ov.remove(); onDone(); return;
    }
    if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  draw(); document.body.appendChild(ov);
}
// parent: a reached goal is redeemed (bought / given) and becomes Completed
function redeemGoal(id){
  const goals = getGoals(), g = goals.find(x => x.id === id);
  if (!g || !goalReached(g)) return;
  g.doneAt = Date.now(); setGoals(goals);
  logToday(e => { e.goalsDone = (e.goalsDone || []).concat(`${g.e} ${g.name}`); });
  cheer(`🏆 ${g.e}`, `Goal complete! You got your ${g.name}! You saved for it yourself!`, `目标完成！你得到了${g.name}！是你自己存钱换来的！`);
}
// cash-out day, step 2: he puts each dollar into a goal jar or "spend now"
function allocate(n){
  const goals = getGoals().filter(g => !g.doneAt && !goalReached(g));
  const ask = alloc => { say('Ask Mommy or Daddy to say yes!', '请爸爸妈妈确认！'); parentGate(() => confirmPay(n, alloc)); };
  if (!goals.length) return ask({spend: n});
  const alloc = {};
  const buckets = [...goals, {id: 'spend', e: '🛍️', name: 'Spend now', zh: '现在花'}];
  const placed = () => Object.values(alloc).reduce((a, b) => a + b, 0);
  const ov = document.createElement('div'); ov.className = 'overlay';
  const draw = () => {
    const left = n - placed();
    ov.innerHTML = `<div class="card gate alloc">
      <p class="gate-q">Where does your money go?<br><small>你的钱要放到哪里？</small></p>
      <div class="alloc-left">${left ? '💵'.repeat(left) : '✅'} <b>${left ? `$${left} left 还剩` : 'All placed! 都放好了！'}</b></div>
      <div class="alloc-grid">${buckets.map(b => {
        const a = alloc[b.id] || 0;
        const info = b.id === 'spend' ? `$${a}` : `$${b.saved + a} / $${b.target}`;
        const full = b.id !== 'spend' && b.saved + a >= b.target;
        return `<div class="ab ${a ? 'has' : ''} ${full ? 'full' : ''}">
          <button class="ab-add chunky" data-a="${b.id}"><span class="g-pic">${b.e}</span><b>${esc(b.name)}</b>${b.zh ? `<small>${b.zh}</small>` : ''}<small>${info}${full ? ' · full 满了' : ''}</small>${a ? `<i>+$${a}</i>` : ''}</button>
          ${a ? `<button class="ab-minus" data-m="${b.id}" aria-label="Take one back">−</button>` : ''}</div>`;
      }).join('')}</div>
      <div class="gate-opts"><button class="pill chunky" data-x>Back 返回</button>
        <button class="ok-btn chunky" data-done ${left ? 'disabled' : ''}>✅ Done! 好了</button></div></div>`;
  };
  ov.onclick = e => {
    const ab = e.target.closest('[data-a]'), mb = e.target.closest('[data-m]');
    if (ab){
      const b = buckets.find(x => x.id === ab.dataset.a), a = alloc[b.id] || 0;
      if (n - placed() <= 0) return say('All your money is placed!', '钱都放好了！');
      if (b.id !== 'spend' && b.saved + a >= b.target) return say(`${b.name} is full!`, `${b.name}已经满了！`);
      alloc[b.id] = a + 1; sfx.pop(); draw();
      if (b.id === 'spend') say('One dollar to spend now!', '一块钱现在花！');
      else if (b.saved + a + 1 >= b.target) say(`One dollar for ${b.name}. Now it's full! You did it!`, `一块钱放进${b.name}，满了！你做到了！`);
      else say(`One dollar for ${b.name}!`, `一块钱放进${b.name}！`);
      return;
    }
    if (mb){ alloc[mb.dataset.m] = Math.max(0, (alloc[mb.dataset.m] || 0) - 1); sfx.pop(); draw(); return; }
    if (e.target.closest('[data-done]')){ if (n - placed() > 0) return; ov.remove(); ask(alloc); return; }
    if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  draw(); document.body.appendChild(ov);
  say(`You have ${n} dollar${n === 1 ? '' : 's'}. Tap where each dollar goes!`, `你有${n}块钱，点一点，把每块钱放到哪里？`);
}

/* ---------- module shell ---------- */
function openModule(m, mode){
  navigate(); curSection = 'trace';
  const modes = m.modes;
  $app.innerHTML = `
    <header class="top">
      <button class="round chunky" id="homeBtn" aria-label="Home">${IC.home}</button>
      <div class="title">${m.en}<span class="zh">${m.zh}</span></div>
      <div class="stars">⭐ <b id="starCount">${stars}</b></div>
    </header>
    ${modes ? `<nav class="modes">${modes.map(([id, en, zh]) =>
      `<button class="chunky ${mode===id?'on':''}" data-mode="${id}">${en}<span class="zh">${zh}</span></button>`).join('')}</nav>` : ''}
    <main id="stage" class="stage"></main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  $app.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    if (b.dataset.mode === mode) return;
    sfx.pop(); openModule(m, b.dataset.mode);
  });
  traceScreen(document.getElementById('stage'), mode);
}

const WORD_BANK = {};   // L -> [{w, e, zh, L}]
const WORD_INDEX = {};  // word -> entry
Object.entries(WORD_BANK_SRC).forEach(([L, src]) => {
  WORD_BANK[L] = src.split(', ').map(s => { const [w, e, zh] = s.split(' '); const o = {w, e, zh, L}; WORD_INDEX[w] = o; return o; });
});
const todayKey = () => new Date().toDateString();
function todayWords(){ const t = store.get('words.today', null); return t && t.d === todayKey() ? t.w : []; }
function markLearned(w){
  const list = todayWords();
  if (!list.includes(w)){ list.push(w); store.set('words.today', {d: todayKey(), w: list}); }
}
const gameDoneToday = () => { const g = store.get('words.game', null); return !!(g && g.d === todayKey()); };
const GAME_LEN = 10;
// show the word with the letter being studied highlighted
function wordHTML(w, L){
  const i = w.indexOf(L.toLowerCase());
  return i < 0 ? w : `${w.slice(0, i)}<b>${w[i]}</b>${w.slice(i + 1)}`;
}

  navigate(); curSection = 'words';

  markLearned(it.w);
  if (i === list.length - 1){ const s = store.get('words.seen', {}); s[L] = true; store.set('words.seen', s); }

function samplePts(pts){
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], d = Math.hypot(x1-x0, y1-y0);
    if (d < 0.01) continue;

    for (let k = 1; k <= n; k++) out.push([x0 + (x1-x0)*k/n, y0 + (y1-y0)*k/n]);

/* ---------- handwriting grader ---------- */
const GRADE_R = 0.11;                 // match radius, as a fraction of letter size
const GRADE_ANG = 0.6;                // max difference in line direction (radians)
const STAMP_3 = 0.78, STAMP_2 = 0.55;// score needed for 3 / 2 stamps
// sample a stroke and attach the (undirected) line direction at each point
function dirPts(stroke){
  const S = samplePts(stroke);
  return S.map((pt, i) => {
    const a = S[Math.max(0, i - 2)], b = S[Math.min(S.length - 1, i + 2)];
    let ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (ang < 0) ang += Math.PI; if (ang >= Math.PI) ang -= Math.PI;
    return [pt[0], pt[1], ang, a !== b];
  });
}
function normPts(pts){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const w = x1 - x0, h = y1 - y0, s = Math.max(w, h, 1e-6), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return {pts: pts.map(([x, y, a, ok]) => [(x - cx) / s, (y - cy) / s, a, ok]), w: w / s, h: h / s, size: s};
}
function nearFrac(from, to, r, ang = GRADE_ANG){
  let hit = 0;
  for (const [x, y, a, ok] of from){
    for (const [u, v, b, ok2] of to){
      if ((x-u)*(x-u) + (y-v)*(y-v) >= r*r) continue;
      let d = Math.abs(a - b); d = Math.min(d, Math.PI - d);
      if (!ok || !ok2 || d < ang){ hit++; break; }   // dots (i, j) have no direction
    }
  }
  return hit / from.length;
}
/* Compares the shape of his writing with the model letter, ignoring where he wrote it
   and how big. Returns a 0..1 score and 1..3 stamps (0 = nothing written yet). */
function gradeWriting(inkStrokes, targetStrokes, opt = {}){
  const R = opt.r || GRADE_R, ANG = opt.ang || GRADE_ANG, MIN = opt.minSize == null ? 15 : opt.minSize, EXTRA = opt.extra || 1.5;
  const ink = [].concat(...inkStrokes.filter(s => s.length > 1).map(dirPts));
  const tgt = [].concat(...targetStrokes.map(dirPts));
  if (ink.length < 6) return {stamps: 0, score: 0};
  const A = normPts(ink), B = normPts(tgt);
  if (A.size < MIN) return {stamps: 0, score: 0, tiny: true};
  const cover = nearFrac(B.pts, A.pts, R, ANG);   // did he draw every part of the letter?
  const prec  = nearFrac(A.pts, B.pts, R, ANG);   // is his ink where the letter is?
  let score = cover + prec ? 2 * cover * prec / (cover + prec) : 0;
  const aspect = Math.abs(Math.log((A.w + .08) / (A.h + .08)) - Math.log((B.w + .08) / (B.h + .08)));
  score -= Math.max(0, aspect - 0.4) * 0.3;                         // much too wide / too tall
  const extra = (ink.length / A.size) / (tgt.length / B.size);      // how much more line than needed
  score -= Math.max(0, extra - EXTRA) * 0.25;                       // scribbling over it
  const stamps = score >= STAMP_3 ? 3 : score >= STAMP_2 ? 2 : 1;
  return {stamps, score, cover, prec};
}
