<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A's Academy">
<meta name="theme-color" content="#fff8ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>A's Academy</title>
<style>
:root{
  --ink:#2b2d42; --muted:#6b7280; --bg:#fff8ec; --card:#fff; --edge:#efd6a6;
  --coral:#ff6b6b; --sky:#3b9cf0; --sun:#ffc531; --leaf:#37b24d; --grape:#9775fa;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
body{background-image:radial-gradient(#ffe2b0 1.6px,transparent 1.6px);background-size:30px 30px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.zh{font-size:.68em;color:var(--muted);font-weight:700;margin-left:.25em}

/* chunky pressable */
.chunky{--sh:var(--edge);box-shadow:0 7px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.chunky:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;margin-bottom:8px}
.hello{font-size:clamp(26px,4.4vw,44px);font-weight:900}
.title{font-size:clamp(22px,3.6vw,38px);font-weight:900;text-align:center;flex:1;line-height:1.1}
.right{display:flex;gap:12px;align-items:center}
.stars{background:#fff;border-radius:999px;padding:8px 18px;font-size:clamp(20px,3vw,30px);font-weight:900;box-shadow:0 5px 0 var(--edge);white-space:nowrap}
.stars.bump{animation:pop .45s}
.round{width:64px;height:64px;border-radius:50%;background:#fff;font-size:30px;flex:none;display:grid;place-items:center}
.pill{background:#fff;border-radius:999px;padding:10px 16px;font-weight:900;font-size:16px}

/* home */
.home-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2.6vw,28px);padding-bottom:8px}
.tile{background:var(--c);color:var(--t,#fff);border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;--sh:var(--d);min-height:150px}
.tile-icon{font-size:clamp(54px,11vw,120px);line-height:1;font-weight:900;letter-spacing:-.02em}
.tile-en{font-size:clamp(24px,4.2vw,46px);font-weight:900;margin-top:6px}
.tile-zh{font-size:clamp(18px,3vw,32px);font-weight:800;opacity:.9}

/* modes */
.modes{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.modes button{background:#fff;border-radius:999px;padding:10px 22px;font-size:clamp(18px,2.6vw,24px);font-weight:900;--sh:var(--edge)}
.modes button.on{background:var(--ink);color:#fff;--sh:#11131f}
.modes button.on .zh{color:#d0d4e4}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.6vh,28px);overflow:auto;padding:8px 2px 14px}
.stage.scroll{justify-content:flex-start}
.prompt{display:flex;align-items:center;gap:14px;max-width:900px}
.prompt-text{font-size:clamp(24px,4.2vw,44px);font-weight:900;line-height:1.15}
.prompt-text .zh{display:block;margin:4px 0 0}
.speak{width:58px;height:58px;font-size:26px}

.scene{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(6px,1.4vw,14px);max-width:920px}
.obj{position:relative;font-size:clamp(40px,7vw,76px);line-height:1;background:#fff;border-radius:20px;padding:8px;animation:popin .35s both;box-shadow:0 4px 0 var(--edge)}
.obj.counted{background:#fff3bf}
.obj .n{position:absolute;top:-10px;right:-10px;background:var(--sky);color:#fff;font-size:18px;font-weight:900;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.obj.gone{opacity:.35}
.obj.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);font-size:1.1em;font-weight:900}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:300px;background:#fff;border-radius:24px;padding:10px 12px;box-shadow:0 5px 0 var(--edge)}
.group .obj{box-shadow:none;padding:2px;font-size:clamp(34px,5.4vw,58px)}
.group-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.group-num{font-size:clamp(28px,4vw,42px);font-weight:900}
.op{font-size:clamp(40px,7vw,72px);font-weight:900;color:var(--grape)}
.q{font-size:clamp(56px,9vw,96px);font-weight:900;color:var(--coral);min-width:1.2em;text-align:center}

.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,3vw,30px)}
.choice{width:clamp(108px,20vw,190px);aspect-ratio:1;background:#fff;border-radius:30px;font-size:clamp(54px,10vw,112px);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.choice small{font-size:.3em;color:var(--muted);margin-top:6px}
.choice svg{width:72%;height:72%}
.choice.right{background:#d3f9d8;--sh:#8ce99a;animation:pop .5s}
.choice.wrong{animation:shake .4s;opacity:.35}

/* grids for learn mode */
.grid{display:grid;gap:clamp(10px,1.8vw,18px);width:100%;max-width:1000px}
.grid.letters{grid-template-columns:repeat(auto-fill,minmax(clamp(68px,11vw,112px),1fr))}
.cell{aspect-ratio:1;border-radius:24px;background:var(--c);color:#fff;font-size:clamp(34px,6vw,60px);font-weight:900;--sh:rgba(0,0,0,.18);display:grid;place-items:center}
.section-h{font-size:clamp(22px,3.4vw,34px);font-weight:900;align-self:center;margin:4px 0 -4px}

/* overlay card */
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.45);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .2s}
.card{background:#fff;border-radius:40px;padding:24px 20px 20px;width:min(580px,100%);max-height:100%;overflow:auto;text-align:center;animation:popin .3s;box-shadow:0 12px 0 rgba(0,0,0,.12)}
.card-body{cursor:pointer}
.card-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.card-nav .round{background:var(--bg)}
.big-letter{font-size:clamp(96px,20vw,190px);font-weight:900;color:var(--coral);line-height:1}
.big-letter span{color:var(--sky);margin-left:.08em}
.big-emoji{font-size:clamp(80px,15vw,140px);line-height:1.15;animation:wiggle 1.2s ease-in-out .3s}
.word{font-size:clamp(34px,6vw,54px);font-weight:900}
.word b{color:var(--coral)}
.zh-word{font-size:clamp(28px,5vw,44px);font-weight:800;color:var(--muted)}
.big-num{font-size:clamp(110px,22vw,200px);font-weight:900;color:var(--sky);line-height:1}
.card .scene{margin-top:10px}
.card .obj{font-size:clamp(34px,6vw,56px)}

/* home: wide trace tile */
.tile.wide{grid-column:1/-1;flex-direction:row;gap:clamp(16px,3vw,40px)}
.tile-txt{display:flex;flex-direction:column;align-items:center}

/* tracing */
.stage{min-height:0}
.stage.trace{justify-content:flex-start;align-items:stretch;overflow:hidden;gap:clamp(8px,1.6vh,16px)}
.trace-top{display:flex;align-items:center;justify-content:center;gap:14px}
.trace-hint{font-size:clamp(24px,4vw,40px);font-weight:900;display:flex;align-items:center;gap:10px}
.trace-hint .emo{font-size:1.4em}
.board{flex:1;min-height:0;background:#fff;border-radius:32px;box-shadow:0 7px 0 var(--edge);overflow:hidden}
.board svg{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none}
.board .ln{stroke:#d9e6f5;stroke-width:1.2}
.board .ln-mid{stroke:#ffc9c9;stroke-dasharray:5 5}
.board .ln-base{stroke:#a5c8ee;stroke-width:1.6}
.board .ln-desc{stroke:#e6eef8}
.g-bed{fill:none;stroke:#eeeaf8;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.g-active{fill:none;stroke:#ddd2fb;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.g-dash{fill:none;stroke:#a99bd0;stroke-width:2.4;stroke-dasharray:1 6;stroke-linecap:round}
.fill{fill:none;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.ink{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;transition:opacity .5s}
.ink.fade{opacity:0}
.start{fill:#40c057;stroke:#fff;stroke-width:2.5}
.start.pulse{animation:dotpulse .6s 2;transform-box:fill-box;transform-origin:center}
.num{fill:#fff;font-size:12px;font-weight:900;text-anchor:middle;pointer-events:none}
.arrow{fill:#40c057;opacity:.85}
.ghost{fill:#ffc531;stroke:#fff;stroke-width:2;opacity:.9}
.board svg.done{animation:pop .6s}
.toolbar{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,14px);flex-wrap:wrap}
.crayons{display:flex;gap:8px;padding:0 6px}
.crayon{width:42px;height:42px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 3px 0 var(--edge)}
.crayon.on{outline:4px solid var(--ink);outline-offset:1px}
#tNext.ready{background:#40c057;animation:breathe 1s ease-in-out infinite}
.picker{width:min(760px,100%)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.pick-grid.words{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pick{position:relative;background:var(--bg);border-radius:18px;padding:10px 6px;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.pick.cur{background:#e5dbff}
.pick i{position:absolute;top:-6px;right:-4px;font-size:16px;font-style:normal}
/* write-by-yourself */
.board{position:relative}
.writing .guide{display:none}
.trace-hint .model{height:clamp(54px,8vh,80px);width:auto;flex:none;background:#fff;border-radius:14px;box-shadow:0 4px 0 var(--edge)}
.model path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.slots{display:flex;gap:8px}
.slot{width:clamp(48px,7vw,70px);height:clamp(48px,7vw,70px);border-radius:50%;background:#fff;border:3px dashed #d8cdb6;display:grid;place-items:center;font-size:20px;color:#c4b89e;font-weight:900}
.slot.now{border:3px solid var(--grape);color:var(--grape);animation:breathe 1.2s ease-in-out infinite}
.slot .stamps{display:flex;flex-wrap:wrap;justify-content:center;max-width:90%}
.slot .stamp{font-size:clamp(13px,2vw,18px);width:auto;height:auto;border:0;box-shadow:none;animation:none;transform:none;background:none;color:#e03131}
.stamp{display:inline-grid;place-items:center;width:clamp(70px,11vw,110px);height:clamp(70px,11vw,110px);border:6px solid #e03131;border-radius:50%;color:#e03131;font-size:clamp(40px,6vw,64px);background:rgba(255,245,245,.9);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px #e03131;transform:rotate(-12deg);opacity:0;animation:stampin .35s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp:nth-child(2){animation-delay:.28s}.stamp:nth-child(3){animation-delay:.56s}
.stamp-fx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:rgba(255,255,255,.55)}
.stamp-fx>div{text-align:center}
.stamp-fx .stamps{display:flex;gap:14px;justify-content:center}
.stamp-fx p{font-size:clamp(28px,4.5vw,46px);font-weight:900;margin:14px 0 0}
.stamp-fx.summary{background:rgba(255,255,255,.85)}
.stamp-fx .big{font-size:clamp(54px,9vw,96px)}
.stamp-fx .big small{font-size:.45em;color:var(--muted)}
.stamp-fx .sub{font-size:clamp(16px,2.2vw,22px);color:var(--muted)}
.ok-btn{background:#40c057;color:#fff;border-radius:999px;padding:12px 22px;font-size:clamp(20px,2.8vw,26px);font-weight:900;--sh:#2b8a3e}
.ok-btn .zh{color:#e6fcf5}
.ok-btn[hidden]{display:none}
.ok-btn.ready{animation:breathe 1s ease-in-out infinite}
.pick i.bst{color:#e03131;font-size:13px;letter-spacing:-1px}
.slot .stamp{opacity:1}
/* letter cycle steps */
.steps{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 4px 0 var(--edge)}
.chip{font-size:clamp(18px,2.6vw,26px);font-weight:900;padding:2px 10px;border-radius:999px;color:#b9b0a0}
.chip.now{background:var(--grape);color:#fff}
.chip.ok{color:#2b8a3e}
.chip.ok::before{content:"✓ "}
.arr{color:#c9bfae;font-weight:900}
/* star flying into the counter */
.flystar{position:fixed;z-index:40;font-size:44px;margin:-26px 0 0 -26px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.4,.6,1)}
/* piggy bank */
.stage.bank{gap:clamp(8px,1.8vh,18px);text-align:center}
.piggy{font-size:clamp(90px,16vw,160px);line-height:1;animation:wiggle 1.4s ease-in-out}
.bank-money{font-size:clamp(56px,10vw,100px);font-weight:900;color:#2b8a3e;line-height:1}
.bank-rule{font-size:clamp(20px,3vw,28px);font-weight:900;color:var(--muted)}
.bills{font-size:clamp(28px,4vw,40px);min-height:1em;max-width:700px}
.meter{position:relative;width:min(560px,90%);height:44px;background:#fff;border-radius:999px;box-shadow:0 4px 0 var(--edge);overflow:hidden}
.meter div{height:100%;background:linear-gradient(90deg,#ffd43b,#fab005);border-radius:999px}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px}
.bank-next{font-size:clamp(18px,2.6vw,24px);font-weight:800}
.bank-next .zh{display:block}
.parent-btn{font-size:16px;margin-top:8px}
.stage.habits{gap:14px}
.mood-card,.habit-head,.habit-grid{width:min(900px,100%)}
.mood-card{background:#fff;border-radius:30px;box-shadow:0 7px 0 var(--edge);padding:14px 16px;text-align:center}
.mood-card h3,.habit-head h3{margin:4px 0 10px;font-size:clamp(20px,3vw,28px)}
.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.4vw,14px)}
.mood{background:var(--bg);border-radius:22px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:clamp(14px,2vw,18px)}
.mood span{font-size:clamp(40px,7vw,64px);line-height:1.1}
.mood small{color:var(--muted);font-size:.85em}
.mood.on{background:#ffe066;outline:4px solid var(--ink)}
.mood-reply{font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:10px 0 2px;min-height:1em}
.mood-reply .zh{display:block}
.habit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.habit-head h3 b{color:#0ca678;margin-left:6px}
.parent-btn.unlocked{background:#ffe066}
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,40vw,420px),1fr));gap:12px}
.habit{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;text-align:left}
.habit .h-e{font-size:clamp(34px,5vw,46px)}
.habit .h-t{flex:1;font-weight:900;font-size:clamp(16px,2.3vw,21px);display:flex;flex-direction:column}
.habit .h-t small{color:var(--muted);font-size:.85em}
.habit .h-c{font-size:30px;min-width:34px;text-align:center}
.habit.on{background:#d3f9d8;--sh:#8ce99a}
.rec .mood-cell{font-size:1.4em}
.rec .time-cell small{display:block;color:var(--muted);font-size:.78em}
.modes{flex-wrap:wrap;align-items:center}
.write-strip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--edge);font-size:clamp(13px,1.7vw,16px)}
.write-strip b{color:var(--grape)}
.ws{color:#b9b0a0;font-weight:800}
.ws small{margin-left:3px;font-size:.8em}
.ws.ok{color:#2b8a3e}
/* icons */
.ic{width:58%;height:58%;display:block}
.round{color:var(--ink)}
.round.ready,#tNext.ready{color:#fff}
.pick .ic,.card-nav .ic{width:60%;height:60%}
.tile-icon svg{width:clamp(76px,11vw,140px);height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
/* home: 4 tasks on top, Piggy Bank bar at the bottom */
.home-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr auto}
.home-grid .tile{min-height:0;padding:14px 8px;text-align:center}
.home-grid .tile-en{font-size:clamp(20px,2.8vw,32px);line-height:1.1}
.home-grid .tile-zh{font-size:clamp(15px,2vw,22px)}
.tile.wide{min-height:0;padding:10px 24px;justify-content:center}
.tile.wide .tile-icon svg{width:clamp(64px,8vw,92px)}
.tile.wide .tile-txt{align-items:flex-start}
.tile-sub{font-size:clamp(14px,1.8vw,18px);font-weight:800;margin-top:2px;opacity:.95}
@media (max-width:900px){ .home-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr auto} }
/* cash-out schedule */
.cash-day{font-size:clamp(14px,1.9vw,17px);color:var(--muted);font-weight:700}
.cash-day b{color:var(--ink)} .cash-day b.due,.gate-sub b.due{color:#2b8a3e}
.sched .pill{font-size:16px;padding:10px 14px}
.sched .pill.on{background:var(--ink);color:#fff}
.sched .pill.on .zh{color:#d0d4e4}
.gate-opts .pill[disabled]{opacity:.5;font-size:16px}
.g-show,.trace-hint{cursor:pointer}
.teach-head{font-size:clamp(20px,3vw,28px);font-weight:900}
.teach-head b{color:var(--grape);margin-left:8px}
.ic-txt{font-size:15px;font-weight:900;letter-spacing:-.5px}
.round.mic{background:#fff0f6;color:#d6336c}
.round.mic.listening{background:#fa5252;color:#fff;animation:breathe .8s ease-in-out infinite}
input{-webkit-user-select:text;user-select:text}
.hello{display:flex;align-items:center;gap:12px;text-align:left}
.avatar{width:clamp(52px,7vw,64px);height:clamp(52px,7vw,64px);flex:none;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.avatar.empty{display:grid;place-items:center;background:#fff;border-radius:50%;font-size:32px}
.avatar.big{width:clamp(200px,34vw,300px);height:auto;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.stage.onboard{justify-content:center}
.ob-card{background:#fff;border-radius:40px;box-shadow:0 10px 0 var(--edge);padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:min(560px,100%)}
.ob-card.wide{width:min(760px,100%)}
.ob-big{font-size:80px;line-height:1;animation:wiggle 1.4s ease-in-out infinite}
.name-in{font:inherit;font-size:clamp(28px,4.6vw,40px);font-weight:900;text-align:center;width:min(380px,100%);padding:12px 18px;border-radius:24px;border:4px solid #e9dcc3;background:var(--bg);color:var(--ink);outline:none}
.name-in:focus{border-color:var(--grape)}
.buddy-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:100%}
.buddy{font-size:clamp(36px,6vw,56px);background:var(--bg);border-radius:22px;padding:6px 0}
.buddy.on{background:#ffe066;outline:4px solid var(--ink)}
.crayons.big .crayon{width:50px;height:50px}
.self-pad{width:min(380px,74vw);height:min(380px,74vw);border-radius:50%}
.self-ink{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.draw-card .toolbar{flex-wrap:wrap}
.skip{color:var(--muted);font-weight:800;font-size:15px;text-decoration:underline}
.making{font-size:72px;animation:wiggle 1s ease-in-out infinite}
.prof-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}

<body>
<div id="app"></div>
<script>
/* ---------- storage (safe) ---------- */
// saved progress; falls back to memory (for this session) if the browser blocks saving
const memStore = {};
const raw = {
  get(k){
    try{ const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); }catch(e){}
    return k in memStore ? JSON.parse(memStore[k]) : null;
  },
  set(k, v){ memStore[k] = JSON.stringify(v); try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// each kid has a profile; everything they earn is saved under their own id
// (the first kid uses the id 'auston' so progress saved before profiles existed is kept)
let profileId = raw.get('academy.current') || 'auston';
const profileIds = () => { const l = raw.get('academy.profiles') || []; return l.includes(profileId) ? l : [...l, profileId]; };
const store = {
  get(k, d){ const v = raw.get(profileId + '.' + k); return v == null ? d : v; },
  set(k, v){ raw.set(profileId + '.' + k, v); }
};
const me = () => store.get('profile', null);   // {name, animal, color, strokes}
/* stars from other iPads (moved by AirDrop) are kept as one snapshot per iPad,
   so sending again replaces the old snapshot instead of counting it twice */
const deviceId = raw.get('academy.device') || (() => { const id = Math.random().toString(36).slice(2, 6).toUpperCase(); raw.set('academy.device', id); return id; })();
const remotes = () => store.get('remotes', {});   // deviceId -> {at, stars, daylog, history}
const remoteStars = () => Object.values(remotes()).reduce((a, r) => a + (r.stars || 0), 0);
const maxN = (x, y) => x == null ? y : y == null ? x : Math.max(x, y);
function mergeDay(a, b){
  if (!a) return JSON.parse(JSON.stringify(b)); if (!b) return a;
  const time = Object.assign({}, a.time); Object.entries(b.time || {}).forEach(([k, v]) => { time[k] = (time[k] || 0) + v; });
  const bonus = Object.assign({}, a.bonus); Object.entries(b.bonus || {}).forEach(([k, v]) => { bonus[k] = (bonus[k] || 0) + v; });
  return {stars: (a.stars || 0) + (b.stars || 0), trace: (a.trace || 0) + (b.trace || 0),
    words: maxN(a.words, b.words), math: maxN(a.math, b.math), paid: (a.paid || 0) + (b.paid || 0),
    habits: [...new Set([...(a.habits || []), ...(b.habits || [])])], mood: a.mood || b.mood,
    tw: Object.assign({}, a.tw, b.tw), time, bonus, said: [...new Set([...(a.said || []), ...(b.said || [])])]};
}
// every iPad's days together, for the Piggy Bank record
function allDaylog(){
  const out = JSON.parse(JSON.stringify(store.get('daylog', {})));
  Object.values(remotes()).forEach(r => Object.entries(r.daylog || {}).forEach(([k, e]) => { out[k] = mergeDay(out[k], e); }));
  return out;
}
function allHistory(){
  const h = store.get('bank.history', []).map(x => ({...x}));
  Object.entries(remotes()).forEach(([id, r]) => (r.history || []).forEach(x => h.push({...x, dev: id})));
  return h.sort((a, b) => a.t - b.t);
}
// `stars` is the total shown to him (this iPad + other iPads); only this iPad's part is saved locally
let stars = store.get('stars', 0) + remoteStars();
const saveStars = () => store.set('stars', stars - remoteStars());
let lang  = store.get('lang', 'both'); // both | en | zh

/* ---------- speech ---------- */
let voices = [];
const hasSpeech = 'speechSynthesis' in window;
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if (hasSpeech){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(code){
  const c = code.toLowerCase();
  const list = voices.filter(v => v.lang.replace('_','-').toLowerCase().startsWith(c));
  return list.find(v => /premium|enhanced/i.test(v.name)) || list.find(v => v.localService) || list[0] || null;
}
function speakParts(parts){
  if (!hasSpeech) return;
  speechSynthesis.cancel();
  parts.forEach(([text, code, rate]) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code;
    const v = pickVoice(code); if (v) u.voice = v;
    u.rate = rate || (code === 'zh-CN' ? 0.8 : 0.85);
    u.pitch = 1.1;
    speechSynthesis.speak(u);
  });
}
function say(en, zh){
  const parts = [];
  if (en && lang !== 'zh') parts.push([en, 'en-US']);
  if (zh && lang !== 'en') parts.push([zh, 'zh-CN']);
  speakParts(parts);
}
// spell it out: "cat… C, A, T… cat" (+ Chinese)
function spellWord(w, zh){
  const letters = w.toUpperCase().split('').join(', ') + '.';
  speakParts([[w, 'en-US', 0.7], [letters, 'en-US', 0.55], [w, 'en-US', 0.7], ...(zh && lang !== 'en' ? [[zh, 'zh-CN']] : [])]);
}
// microphone: he says the word, the iPad's speech recognition checks it
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBusy = false;
function wordSimilar(a, b){
  const m = a.length, n = b.length; if (!m || !n) return 0;
  const d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n);
}
function listenFor(word, zh, btn){
  if (micBusy) return;
  if (!SpeechRec || !window.isSecureContext){
    sfx.oops();
    return say('The microphone needs the app on a secure web address. Ask Mommy or Daddy.', '麦克风需要安全网址才能用，请找爸爸妈妈。');
  }
  if (hasSpeech) speechSynthesis.cancel();
  const w = word.toLowerCase();
  const r = new SpeechRec();
  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  let handled = false;
  micBusy = true; btn.classList.add('listening');
  const done = () => { micBusy = false; btn.classList.remove('listening'); };
  r.onresult = e => {
    handled = true;
    const alts = [...e.results[0]].map(a => a.transcript.toLowerCase().replace(/[^a-z ]/g, '').trim()).filter(Boolean);
    const ok = alts.some(a => a === w || a.split(' ').includes(w) || wordSimilar(a.replace(/ /g, ''), w) >= 0.75);
    if (ok){
      sfx.yay(); burst(btn);
      let first = false;
      logToday(e2 => { e2.said = e2.said || []; if (!e2.said.includes(w)){ e2.said.push(w); first = true; } });
      if (first) flyStar(btn, 300);
      sayWord(w, `说得真好！${zh || ''}`, `Great! You said ${w}!`);
    } else {
      sfx.oops();
      speakParts([...(lang !== 'zh' ? [["Let's try again. Say:", 'en-US']] : [['再说一次：', 'zh-CN']]), [w, 'en-US', 0.65]]);
    }
  };
  r.onerror = e => {
    handled = true;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      say('Please let the app use the microphone.', '请允许使用麦克风。');
    else say("I didn't hear you. Tap the microphone and say it again!", '没听清，再点麦克风说一次！');
  };
  r.onend = () => { done(); if (!handled) say("I didn't hear you. Tap the microphone and say it again!", '没听清，再点麦克风说一次！'); };

let actx;
function tone(freqs, dur, type, vol){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur*1.8);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur*2);
    });
  }catch(e){}
}

function nearbyNumbers(ans, count, lo, hi){
  const set = new Set([ans]);
  let spread = 1;
  while (set.size < count){
    const n = ans + (Math.random()<.5?-1:1) * (1 + rand(spread+1));
    if (n >= lo && n <= hi) set.add(n);
    spread = Math.min(spread+1, 4);
  }
  return shuffle([...set]);

// smooth a hand-drawn line (Chaikin), so the avatar looks soft and cute
function smoothPts(pts, rounds = 2){
  let out = pts;
  for (let r = 0; r < rounds && out.length > 2; r++){
    const n = [out[0]];
    for (let i = 0; i < out.length - 1; i++){
      const [x0, y0] = out[i], [x1, y1] = out[i + 1];
      n.push([x0 * .75 + x1 * .25, y0 * .75 + y1 * .25], [x0 * .25 + x1 * .75, y0 * .25 + y1 * .75]);
    }
    n.push(out[out.length - 1]); out = n;
  }
  return out;
}

  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1 || dt > new Date()) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function ageOf(bd){
  if (!bd) return null;
  const [y, m, d] = bd.split('-').map(Number), now = new Date();
  return now.getFullYear() - y - ((now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) ? 1 : 0);
}

/* parent: see every account on this iPad and delete the ones not in use */
function kidInfo(id){
  const log = raw.get(id + '.daylog') || {}, days = Object.keys(log).sort();
  return {pr: raw.get(id + '.profile'), stars: raw.get(id + '.stars') || 0, last: days[days.length - 1] || null, daysUsed: days.length};
}
function lastUsedText(last){
  if (!last) return 'never used 从未使用';
  const d = Math.round((new Date(isoDay()) - new Date(last)) / 86400000);
  return d <= 0 ? 'used today 今天用过' : d === 1 ? 'last used yesterday 昨天用过' : `last used ${d} days ago ${d}天前用过`;
}
function deleteKid(id){
  const pre = id + '.';
  try { Object.keys(localStorage).filter(k => k.startsWith(pre)).forEach(k => localStorage.removeItem(k)); } catch(e){}
  Object.keys(memStore).filter(k => k.startsWith(pre)).forEach(k => delete memStore[k]);
  const rest = (raw.get('academy.profiles') || []).filter(x => x !== id);
  raw.set('academy.profiles', rest);
  if (id === profileId) raw.set('academy.current', rest[0] || ('kid' + Date.now()));
  return id === profileId || !rest.length;   // true: the app has to restart
}

      }).join('')}</div>

      <div class="gate-opts"><button class="pill chunky gate-ok" data-x>Done 完成</button></div></div>`;
  };
  ov.onclick = e => {

    if (d){ confirmId = d.dataset.del; sfx.pop(); draw(); return; }

  };
  draw(); document.body.appendChild(ov);

    </table></div>` : '<p class="no">No days recorded yet. 还没有记录。</p>'}
    <h3>💵 Cash-outs <span class="zh">兑换记录</span></h3>

/* cash-out schedule chosen by a parent: weekly, every 10 days, or monthly */
const SCHEDULES = {
  week:  {days: 7,   en: 'Every week',    zh: '每周'},
  d10:   {days: 10,  en: 'Every 10 days', zh: '每10天'},
  month: {months: 1, en: 'Every month',   zh: '每月'},
};
const cashSched = () => SCHEDULES[store.get('bank.sched', 'week')] ? store.get('bank.sched', 'week') : 'week';
function nextCashDate(){
  const h = allHistory();
  let start = store.get('bank.start', null);
  if (!start){ start = Date.now(); store.set('bank.start', start); }
  const base = new Date(h.length ? h[h.length - 1].t : start);
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  const sc = SCHEDULES[cashSched()];
  if (sc.months) d.setMonth(d.getMonth() + sc.months); else d.setDate(d.getDate() + sc.days);
  return d;
}
const cashDue = () => Date.now() >= nextCashDate().getTime();
function cashDayText(){
  const d = nextCashDate(), sc = SCHEDULES[cashSched()];
  if (cashDue()) return `📅 ${sc.en} · <b class="due">Cash-out day is today! 今天可以兑换！</b>`;
  const days = Math.ceil((d - Date.now()) / 86400000);
  return `📅 ${sc.en} ${sc.zh} · next cash-out 下次兑换: <b>${d.toLocaleDateString(undefined, {weekday: 'short', month: 'numeric', day: 'numeric'})}</b> (${days} day${days === 1 ? '' : 's'} · ${days}天)`;
}

/* ---------- move stars between iPads: send a file (AirDrop), receive it on the other iPad ---------- */
function exportData(){
  const devices = JSON.parse(JSON.stringify(remotes()));
  devices[deviceId] = {at: Date.now(), stars: store.get('stars', 0), daylog: store.get('daylog', {}), history: store.get('bank.history', [])};
  return {app: 'academy', v: 1, from: deviceId, name: (me() || {}).name || '', profile: me(), exportedAt: Date.now(), devices};
}
function importData(d){
  const rs = remotes();
  Object.entries(d.devices || {}).forEach(([id, snap]) => {
    if (id === deviceId) return;                                   // this iPad's own data is already here
    if (!rs[id] || (snap.at || 0) >= (rs[id].at || 0)) rs[id] = snap; // newer snapshot replaces older one
  });
  store.set('remotes', rs);
  if (!me() && d.profile) store.set('profile', d.profile);
  stars = store.get('stars', 0) + remoteStars();
}
// total after a file is added, without changing anything yet
function previewImport(d){
  const rs = JSON.parse(JSON.stringify(remotes()));
  Object.entries(d.devices || {}).forEach(([id, snap]) => { if (id !== deviceId && (!rs[id] || (snap.at || 0) >= (rs[id].at || 0))) rs[id] = snap; });
  return store.get('stars', 0) + Object.values(rs).reduce((a, r) => a + (r.stars || 0), 0);
}
function syncPanel(){
  const ov = document.createElement('div'); ov.className = 'overlay';
  const name = (me() || {}).name || '';
  const fmtD = t => new Date(t).toLocaleDateString(undefined, {month: 'numeric', day: 'numeric'});
  const draw = (msg = '') => {
    const rs = remotes();
    ov.innerHTML = `<div class="card gate sync">
      <p class="gate-q">📲 Other iPad<br><small>在iPad之间转移星星</small></p>
      <div class="sync-list">
        <div><b>This iPad 本机</b> · ${deviceId} · ⭐ ${store.get('stars', 0)}</div>
        ${Object.entries(rs).map(([id, r]) => `<div>📲 iPad ${id} · ⭐ ${r.stars || 0} · <span class="no">updated ${fmtD(r.at)}</span></div>`).join('')}
        <div class="sync-total">Total for ${name} 合计: ⭐ ${stars}</div>
      </div>
      <div class="gate-opts">
        <button class="pill chunky gate-ok" data-send>📤 Send 发送</button>
        <button class="pill chunky" data-recv>📥 Receive 接收</button>
      </div>
      <input type="file" id="syncFile" accept=".json,application/json" hidden>
      ${msg ? `<p class="sync-msg">${msg}</p>` : ''}
      <ol class="sync-help">
        <li><b>Send</b> on this iPad → choose <b>AirDrop</b> → pick the other iPad. 本机点“发送”，选“隔空投送”。</li>
        <li>On the other iPad: A's Academy → Piggy Bank → 📲 Other iPad → <b>Receive</b> → pick the file (Files → Downloads). 另一台iPad点“接收”，在“文件→下载”里选这个文件。</li>
        <li>Do it again any time — it updates, it never counts twice. 可以随时再做一次，不会重复计算。</li>
      </ol>
      <div class="gate-opts"><button class="pill chunky" data-x>Close</button></div></div>`;
    ov.querySelector('#syncFile').onchange = e => { const f = e.target.files[0]; if (f) receive(f); };
  };
  async function send(){
    const fname = `Academy-${name.replace(/[^A-Za-z0-9]/g, '') || 'kid'}-${isoDay()}.json`;
    const blob = new Blob([JSON.stringify(exportData())], {type: 'application/json'});
    const file = new File([blob], fname, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file], title: `A's Academy – ${name}`}); return draw('✅ Sent! Now tap Receive on the other iPad. 已发送！'); }
      catch (e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    draw(`✅ Saved “${fname}”. Send it to the other iPad (AirDrop), then tap Receive there. 已保存文件。`);
  }
  async function receive(f){
    let d;
    try { d = JSON.parse(await f.text()); } catch (_) { d = null; }
    if (!d || d.app !== 'academy' || !d.devices) return draw("⚠️ That isn't an A's Academy file. 这不是A's Academy的文件。");
    const others = Object.keys(d.devices).filter(id => id !== deviceId);
    if (!others.length) return draw('ℹ️ That file came from this iPad. 这个文件来自本机。');
    const after = previewImport(d);
    const sameKid = !d.name || !name || d.name.toLowerCase() === name.toLowerCase();
    ov.innerHTML = `<div class="card gate sync">
      <p class="gate-q">📥 Add stars?<br><small>加入星星？</small></p>
      <p class="gate-sub">From ${d.name || 'a kid'}'s other iPad (${others.join(', ')})<br>
        <b>${name}: ⭐ ${stars} → ⭐ ${after}</b></p>
      ${sameKid ? '' : `<p class="sync-msg">⚠️ This file is for <b>${d.name}</b>, but this iPad is showing <b>${name}</b>. If that's wrong, cancel and tap the avatar on the home screen to switch kids first.</p>`}
      <div class="gate-opts"><button class="pill chunky" data-cancel>Cancel</button><button class="pill chunky gate-ok" data-add>Add 加入</button></div></div>`;
    ov.querySelector('[data-add]').onclick = () => {
      importData(d); sfx.yay(); ov.remove(); bank();
      cheer(`📲 ⭐ ${stars}`, `Stars from your other iPad are here! You have ${stars} stars.`, `另一台iPad的星星到了！你一共有${stars}颗星星。`);
    };

  }
  ov.onclick = e => {

  };
  draw(); document.body.appendChild(ov);
}

// simple grown-up check so he can't cash out by himself
function parentGate(onPass){
  const a = 6 + rand(4), b = 6 + rand(4), ans = a * b;
  const opts = shuffle([ans, ans + a, ans - b, ans + 10]);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="card gate"><p class="gate-q">Grown-ups only 🔒<br>${a} × ${b} = ?</p>
    <div class="gate-opts">${opts.map(o => `<button class="pill chunky" data-v="${o}">${o}</button>`).join('')}</div>
    <div class="card-nav" style="justify-content:center"><button class="round chunky" data-x aria-label="Close">${IC.close}</button></div></div>`;
  ov.onclick = e => {
    const b2 = e.target.closest('[data-v]');
    if (b2){ ov.remove(); if (+b2.dataset.v === ans) onPass(); else sfx.oops(); }
    else if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  document.body.appendChild(ov);
}
function confirmPay(n, alloc = {spend: n}){
  const ov = document.createElement('div'); ov.className = 'overlay';
  const who = ((typeof me === 'function' && me()) || {}).name || 'He';
  const rest = stars - n * STAMPS_PER_DOLLAR;
  const lines = Object.entries(alloc).filter(([, v]) => v).map(([k, v]) => {
    const g = getGoals().find(x => x.id === k);
    return `<li>${k === 'spend' ? '🛍️ Spend now 现在花' : `${g.e} ${esc(g.name)}`}<b>$${v}</b></li>`;
  }).join('');
  ov.innerHTML = `<div class="card gate"><p class="gate-q">${who} wants 💵 $${n}<br><small>孩子想换${n}块钱</small></p>
    <ul class="alloc-sum">${lines}</ul>
    <p class="gate-sub">Uses ${n * STAMPS_PER_DOLLAR} ⭐ · ${rest} ⭐ ($${Math.floor(rest / STAMPS_PER_DOLLAR)}) keep saving in the piggy bank</p>
    <div class="gate-opts"><button class="pill chunky" data-x>Not now 先不</button><button class="pill chunky gate-ok" data-ok>Pay $${n} ✅ 支付</button></div></div>`;
  ov.onclick = e => {
    if (e.target.closest('[data-ok]')){
      stars -= n * STAMPS_PER_DOLLAR; saveStars();
      const h = store.get('bank.history', []); h.push({t: Date.now(), d: n, s: n * STAMPS_PER_DOLLAR, alloc}); store.set('bank.history', h);
      logToday(e => { e.paid += n; });
      const goals = getGoals(); let filled = null;
      goals.forEach(g => { if (alloc[g.id]){ const was = goalReached(g); g.saved += alloc[g.id]; if (!was && goalReached(g)) filled = g; } });
      setGoals(goals);
      ov.remove(); bank();
      cheer(`💵 $${n} 🎉`, `Yay! You got ${n} dollar${n === 1 ? '' : 's'}! Great saving!`, `耶！你得到了${n}块钱！真会存钱！`);
      if (filled) setTimeout(() => cheer(`🎯 ${filled.e}`, `Your ${filled.name} goal is full! Ask Mom or Dad to redeem it!`, `${filled.name}的目标存满了！请爸爸妈妈兑现！`), 2600);
      return;
    }
    if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  document.body.appendChild(ov);
}

/* ---------- savings goals: parents set them up, he fills them on cash-out day ---------- */
const GOAL_PICS = ['🧸','🚗','🦖','🚂','🎮','📚','🍦','🎨','⚽','🚲','🎁','🏖️','🐶','🧱','🎈','🛝'];
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const getGoals = () => store.get('goals', []);
const setGoals = g => store.set('goals', g);
const goalReached = g => g.saved >= g.target;

function goalCard(g){
  const pct = Math.min(100, Math.round(g.saved / g.target * 100));
  const status = g.doneAt ? `✅ ${new Date(g.doneAt).toLocaleDateString()}`
    : goalReached(g) ? '🎉 Reached! Ask Mom or Dad 达成！请爸爸妈妈兑现' : `$${g.target - g.saved} to go 还差${g.target - g.saved}块`;
  return `<div class="goal ${goalReached(g) ? 'reached' : ''} ${g.doneAt ? 'completed' : ''}">
    <span class="g-pic">${g.e}</span>
    <div class="g-body"><b>${esc(g.name)}</b>
      <div class="g-bar"><div style="width:${pct}%"></div></div>
      <small><b>$${g.saved} / $${g.target}</b> · ${status}</small>
    </div></div>`;
}
function goalsSection(){
  const goals = getGoals(), act = goals.filter(g => !g.doneAt), done = goals.filter(g => g.doneAt);
  return `<section class="goals"><h3>🎯 My goals <span class="zh">我的目标</span></h3>
    ${act.length ? `<div class="goal-grid">${act.map(goalCard).join('')}</div>`
      : '<p class="no">No goals yet — set one with Mom or Dad! 和爸爸妈妈一起定个目标吧！</p>'}
    ${done.length ? `<h4>🏆 Completed <span class="zh">已完成</span></h4><div class="goal-grid">${done.slice().reverse().map(goalCard).join('')}</div>` : ''}
  </section>`;
}
// parent: add / edit / delete a goal
function goalEditor(g, onDone){
  const ov = document.createElement('div'); ov.className = 'overlay';
  let name = g ? g.name : '', pic = g ? g.e : GOAL_PICS[0], target = g ? g.target : 10, delArmed = false;
  const draw = () => {
    ov.innerHTML = `<div class="card gate goal-edit">
      <p class="gate-q">${g ? 'Edit goal' : 'New goal'}<br><small>${g ? '修改目标' : '新目标'}</small></p>
      <input class="g-name" maxlength="30" placeholder="e.g. Lego fire truck 例如：乐高消防车" value="${esc(name)}">
      <div class="pic-pick">${GOAL_PICS.map(e => `<button class="${e === pic ? 'on' : ''}" data-p="${e}">${e}</button>`).join('')}</div>
      <div class="gate-amt"><button class="round chunky" data-d="-5">−5</button><button class="round chunky" data-d="-1">−1</button><b>$${target}</b><button class="round chunky" data-d="1">+1</button><button class="round chunky" data-d="5">+5</button></div>
      <div class="gate-opts">
        ${g ? `<button class="pill chunky" data-del>${delArmed ? 'Tap again to delete 再点一次删除' : '🗑 Delete 删除'}</button>` : ''}
        <button class="pill chunky" data-x>Cancel 取消</button>
        <button class="pill chunky gate-ok" data-save>Save 保存</button></div></div>`;
    const inp = ov.querySelector('.g-name');
    inp.oninput = () => { name = inp.value; };
  };
  ov.onclick = e => {
    const pb = e.target.closest('[data-p]'), db = e.target.closest('[data-d]');
    if (pb){ pic = pb.dataset.p; sfx.pop(); draw(); return; }
    if (db){ target = Math.max(1, Math.min(500, target + +db.dataset.d)); sfx.pop(); draw(); return; }
    if (e.target.closest('[data-save]')){
      if (!name.trim()){ ov.querySelector('.g-name').focus(); return; }
      const goals = getGoals();
      if (g){ Object.assign(goals.find(x => x.id === g.id), {name: name.trim(), e: pic, target}); }
      else goals.push({id: 'g' + Date.now().toString(36), name: name.trim(), e: pic, target, saved: 0, createdAt: Date.now()});
      setGoals(goals); sfx.yay(); ov.remove(); onDone(); return;
    }
    if (e.target.closest('[data-del]')){
      if (!delArmed){ delArmed = true; draw(); return; }
      setGoals(getGoals().filter(x => x.id !== g.id)); ov.remove(); onDone(); return;
    }
    if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  draw(); document.body.appendChild(ov);
}
// parent: a reached goal is redeemed (bought / given) and becomes Completed
function redeemGoal(id){
  const goals = getGoals(), g = goals.find(x => x.id === id);
  if (!g || !goalReached(g)) return;
  g.doneAt = Date.now(); setGoals(goals);
  logToday(e => { e.goalsDone = (e.goalsDone || []).concat(`${g.e} ${g.name}`); });
  cheer(`🏆 ${g.e}`, `Goal complete! You got your ${g.name}! You saved for it yourself!`, `目标完成！你得到了${g.name}！是你自己存钱换来的！`);
}
// cash-out day, step 2: he puts each dollar into a goal jar or "spend now"
function allocate(n){
  const goals = getGoals().filter(g => !g.doneAt && !goalReached(g));
  const ask = alloc => { say('Ask Mommy or Daddy to say yes!', '请爸爸妈妈确认！'); parentGate(() => confirmPay(n, alloc)); };
  if (!goals.length) return ask({spend: n});
  const alloc = {};
  const buckets = [...goals, {id: 'spend', e: '🛍️', name: 'Spend now', zh: '现在花'}];
  const placed = () => Object.values(alloc).reduce((a, b) => a + b, 0);
  const ov = document.createElement('div'); ov.className = 'overlay';
  const draw = () => {
    const left = n - placed();
    ov.innerHTML = `<div class="card gate alloc">
      <p class="gate-q">Where does your money go?<br><small>你的钱要放到哪里？</small></p>
      <div class="alloc-left">${left ? '💵'.repeat(left) : '✅'} <b>${left ? `$${left} left 还剩` : 'All placed! 都放好了！'}</b></div>
      <div class="alloc-grid">${buckets.map(b => {
        const a = alloc[b.id] || 0;
        const info = b.id === 'spend' ? `$${a}` : `$${b.saved + a} / $${b.target}`;
        const full = b.id !== 'spend' && b.saved + a >= b.target;
        return `<div class="ab ${a ? 'has' : ''} ${full ? 'full' : ''}">
          <button class="ab-add chunky" data-a="${b.id}"><span class="g-pic">${b.e}</span><b>${esc(b.name)}</b>${b.zh ? `<small>${b.zh}</small>` : ''}<small>${info}${full ? ' · full 满了' : ''}</small>${a ? `<i>+$${a}</i>` : ''}</button>
          ${a ? `<button class="ab-minus" data-m="${b.id}" aria-label="Take one back">−</button>` : ''}</div>`;
      }).join('')}</div>
      <div class="gate-opts"><button class="pill chunky" data-x>Back 返回</button>
        <button class="ok-btn chunky" data-done ${left ? 'disabled' : ''}>✅ Done! 好了</button></div></div>`;
  };
  ov.onclick = e => {
    const ab = e.target.closest('[data-a]'), mb = e.target.closest('[data-m]');
    if (ab){
      const b = buckets.find(x => x.id === ab.dataset.a), a = alloc[b.id] || 0;
      if (n - placed() <= 0) return say('All your money is placed!', '钱都放好了！');
      if (b.id !== 'spend' && b.saved + a >= b.target) return say(`${b.name} is full!`, `${b.name}已经满了！`);
      alloc[b.id] = a + 1; sfx.pop(); draw();
      if (b.id === 'spend') say('One dollar to spend now!', '一块钱现在花！');
      else if (b.saved + a + 1 >= b.target) say(`One dollar for ${b.name}. Now it's full! You did it!`, `一块钱放进${b.name}，满了！你做到了！`);
      else say(`One dollar for ${b.name}!`, `一块钱放进${b.name}！`);
      return;
    }
    if (mb){ alloc[mb.dataset.m] = Math.max(0, (alloc[mb.dataset.m] || 0) - 1); sfx.pop(); draw(); return; }
    if (e.target.closest('[data-done]')){ if (n - placed() > 0) return; ov.remove(); ask(alloc); return; }
    if (e.target === ov || e.target.closest('[data-x]')) ov.remove();
  };
  draw(); document.body.appendChild(ov);
  say(`You have ${n} dollar${n === 1 ? '' : 's'}. Tap where each dollar goes!`, `你有${n}块钱，点一点，把每块钱放到哪里？`);
}

    ${modes ? `<nav class="modes">${modes.map(([id, en, zh]) =>
      `<button class="chunky ${mode===id?'on':''}" data-mode="${id}">${en}<span class="zh">${zh}</span></button>`).join('')}</nav>` : ''}
    <main id="stage" class="stage"></main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  $app.querySelectorAll('.modes button').forEach(b => b.onclick = () => {

}

/* daily game: 10 questions on words learned today, multiple choice */
function dailyGame(){
  navigate(); curSection = 'words';
  $app.innerHTML = `${wordsHeader("Today's game", '今日游戏')}<main id="stage" class="stage"></main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  const stage = document.getElementById('stage');
  // 10 random words from the whole word bank, each with its own picture
  const ALL = Object.values(WORD_INDEX);
  const qs = [], seenE = new Set();
  for (const o of shuffle(ALL)){ if (qs.length >= GAME_LEN) break; if (!seenE.has(o.e)){ seenE.add(o.e); qs.push(o); } }
  let n = 0, score = 0;
  // wrong choices: other random words with a different picture
  const others = ans => sample(ALL.filter(x => x.w !== ans.w && x.e !== ans.e), 2);
  function ask(){
    const ans = qs[n], opts = shuffle([ans, ...others(ans)]);
    const pictureQ = n % 2 === 0;   // even: see the word, pick the picture; odd: see the picture, pick the word
    let firstTry = true, locked = false;
    stage.innerHTML = `
      <div class="dots">${qs.map((_, k) => `<span class="${k < n ? 'past' : k === n ? 'now' : ''}"></span>`).join('')}</div>
      <div class="prompt">
        <button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
        <div class="prompt-text">${pictureQ ? 'Which picture?' : 'Which word?'}<span class="zh">${pictureQ ? '是哪个图片？' : '是哪个单词？'}</span></div>
      </div>
      <div class="g-show ${pictureQ ? 'word' : 'pic'}">${pictureQ ? ans.w : ans.e}</div>
      <div class="choices">${opts.map((o, i) => `<button class="choice chunky ${pictureQ ? '' : 'word-choice'}" data-i="${i}">${pictureQ ? o.e : o.w}</button>`).join('')}</div>`;
    const prompt = () => pictureQ
      ? sayWord(ans.w, '读一读，是哪个图片？', 'Which picture is it?')
      : sayWord(ans.w, '是哪个单词？找一找！', 'Which word says that?');
    stage.querySelector('.g-show').onclick = () => { sfx.pop(); sayWord(ans.w); };
    stage.querySelector('.speak').onclick = () => { sfx.pop(); prompt(); };
    prompt();
    stage.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked || b.disabled) return;
      const o = opts[+b.dataset.i];
      if (o === ans){
        locked = true; b.classList.add('right'); sfx.yay(); burst(b);
        if (firstTry) score++;
        flyStar(b, 300);   // a star every time he gets it right
        say(`Yes! ${ans.w}!`, `对了！${ans.zh}！`);
        later(() => { n++; n < GAME_LEN ? ask() : finish(); }, 2000);
      } else {
        firstTry = false; b.classList.add('wrong'); b.disabled = true; sfx.oops();
        sayWord(o.w, `这是${o.zh}，再试一次！`, `That's ${o.w}. Try again!`);
      }
    });
  }
  function finish(){
    const prev = store.get('words.game', null);
    const bestToday = prev && prev.d === todayKey() ? Math.max(prev.score, score) : score;
    store.set('words.game', {d: todayKey(), score: bestToday});
    logToday(e => { e.words = Math.max(e.words || 0, score); });
    later(() => taskBonus('words', stage.querySelector('.cheer-card')), 50);
    stage.innerHTML = `<div class="cheer-card">
      <div class="wc-emoji">${score >= 8 ? '🏆' : score >= 5 ? '🥈' : '💪'}</div>
      <p class="big-txt">${score} / ${GAME_LEN}<span class="zh">答对了${score}个</span></p>
      <p class="sub-txt">Today's game is done! ✅ 今天的游戏完成了！</p>
      <div class="gate-opts">
        <button class="pill chunky big-pill" id="again">🔁 Play again<span class="zh">再玩一次</span></button>
        <button class="ok-btn chunky" id="toWords">🔤 Words<span class="zh">单词</span></button>
      </div></div>`;
    sfx.yay(); burst(stage.querySelector('.cheer-card'));
    say(`You got ${score} out of ${GAME_LEN}! Today's game is done!`, `你答对了${score}个！今天的游戏完成啦！`);
    document.getElementById('again').onclick = () => { sfx.pop(); dailyGame(); };
    document.getElementById('toWords').onclick = () => { sfx.pop(); wordsHome(); };
  }
  // first teach today's 10 game words one by one (picture + pronunciation), then play
  const teachList = [...new Set(qs)];
  function teach(i){
    const it = teachList[i], last = i === teachList.length - 1;
    stage.innerHTML = `
      <div class="teach-head">Learn first! <span class="zh">先学一学！</span> <b>${i + 1} / ${teachList.length}</b></div>
      <div class="dots">${teachList.map((_, k) => `<span class="${k < i ? 'past' : k === i ? 'now' : ''}"></span>`).join('')}</div>
      <button class="word-card" id="tCard">
        <div class="wc-emoji">${it.e}</div>
        <div class="wc-word">${wordHTML(it.w, it.L)}</div>
        <div class="wc-zh">${it.zh}</div>
        <div class="wc-count">Say it with me! Then tap 🎤 跟我读，再点麦克风说一说！</div>
      </button>
      <div class="toolbar">
        <button class="round chunky" id="tPrev" aria-label="Previous" ${i === 0 ? 'disabled' : ''}>${IC.prev}</button>
        <button class="round chunky" id="tSay" aria-label="Say it">${IC.speak}</button>
        <button class="round chunky" id="tSpell" aria-label="Spell it">${IC.spell}</button>
        <button class="round chunky mic" id="tMic" aria-label="Say it into the microphone">${IC.mic}</button>
        <button class="${last ? 'ok-btn' : 'round'} chunky ready" id="tNext" aria-label="Next">${last ? "🎮 Let's play!<span class=\"zh\">开始游戏</span>" : IC.next}</button>
      </div>`;
    // word, then "say it with me", then the word again (slower), then Chinese
    const speak = () => speakParts([[it.w, 'en-US', 0.7], [it.w.toUpperCase().split('').join(', ') + '.', 'en-US', 0.55],
      ...(lang !== 'zh' ? [['Say it with me:', 'en-US']] : [['跟我读：', 'zh-CN']]),
      [it.w, 'en-US', 0.6], ...(lang !== 'en' ? [[it.zh, 'zh-CN']] : [])]);
    stage.querySelector('#tCard').onclick = () => { sfx.pop(); speak(); };
    stage.querySelector('#tSay').onclick = () => { sfx.pop(); speak(); };
    stage.querySelector('#tSpell').onclick = () => { sfx.pop(); spellWord(it.w, it.zh); };
    stage.querySelector('#tMic').onclick = e => listenFor(it.w, it.zh, e.currentTarget);
    stage.querySelector('#tPrev').onclick = () => { if (i > 0){ sfx.pop(); teach(i - 1); } };
    stage.querySelector('#tNext').onclick = () => {
      sfx.pop();
      if (!last) return teach(i + 1);
      say("Great! Now let's play the game!", '真棒！现在开始游戏吧！');
      qs.splice(0, qs.length, ...shuffle(qs));   // ask in a different order than taught
      later(ask, 1800);
    };
    speak();
  }
  say(`First, let's learn ${teachList.length} words!`, `先来学${teachList.length}个单词！`);
  later(() => teach(0), 1800);
  stage.innerHTML = `<div class="cheer-card"><div class="wc-emoji">📚</div><p class="big-txt">Learn ${teachList.length} words, then play!<span class="zh">先学${teachList.length}个单词，再玩游戏！</span></p></div>`;
}

/* ---------- TRACING: letter strokes ----------
   Coordinates: capital top y=20, x-height y=60, baseline y=120, descender y=160.
   Each glyph = advance width + ordered strokes (point lists, in writing direction). */
const arc = (cx, cy, rx, ry, t0, t1) => {
  const n = Math.max(6, Math.ceil(Math.abs(t1 - t0) / 6)), o = [];
  for (let i = 0; i <= n; i++){ const t = (t0 + (t1 - t0) * i / n) * Math.PI / 180; o.push([cx + rx*Math.cos(t), cy - ry*Math.sin(t)]); }
  return o;
};
const ln = (...xy) => { const o = []; for (let i = 0; i < xy.length; i += 2) o.push([xy[i], xy[i+1]]); return o; };

function samplePts(pts){

  for (let i = 1; i < pts.length; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], d = Math.hypot(x1-x0, y1-y0);

const GRADE_R = 0.11;                 // match radius, as a fraction of letter size
const GRADE_ANG = 0.6;                // max difference in line direction (radians)

// sample a stroke and attach the (undirected) line direction at each point
function dirPts(stroke){
  const S = samplePts(stroke);
  return S.map((pt, i) => {
    const a = S[Math.max(0, i - 2)], b = S[Math.min(S.length - 1, i + 2)];
    let ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (ang < 0) ang += Math.PI; if (ang >= Math.PI) ang -= Math.PI;

}
function normPts(pts){

  pts.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });

}
function nearFrac(from, to, r){
  let hit = 0;
  for (const [x, y, a, ok] of from){

      if ((x-u)*(x-u) + (y-v)*(y-v) >= r*r) continue;
      let d = Math.abs(a - b); d = Math.min(d, Math.PI - d);
      if (!ok || !ok2 || d < GRADE_ANG){ hit++; break; }   // dots (i, j) have no direction

/* Compares the shape of his writing with the model letter, ignoring where he wrote it

function gradeWriting(inkStrokes, targetStrokes){
  const ink = [].concat(...inkStrokes.filter(s => s.length > 1).map(dirPts));
  const tgt = [].concat(...targetStrokes.map(dirPts));
  if (ink.length < 6) return {stamps: 0, score: 0};
  const A = normPts(ink), B = normPts(tgt);
  if (A.size < 15) return {stamps: 0, score: 0, tiny: true};
  const cover = nearFrac(B.pts, A.pts, GRADE_R);   // did he draw every part of the letter?
  const prec  = nearFrac(A.pts, B.pts, GRADE_R);   // is his ink where the letter is?
  let score = cover + prec ? 2 * cover * prec / (cover + prec) : 0;
  const aspect = Math.abs(Math.log((A.w + .08) / (A.h + .08)) - Math.log((B.w + .08) / (B.h + .08)));
  score -= Math.max(0, aspect - 0.4) * 0.3;                         // much too wide / too tall
  const extra = (ink.length / A.size) / (tgt.length / B.size);      // how much more line than needed
  score -= Math.max(0, extra - 1.5) * 0.25;                         // scribbling over it
  const stamps = score >= STAMP_3 ? 3 : score >= STAMP_2 ? 2 : 1;
  return {stamps, score, cover, prec};
}

    partial.setAttribute('d', pathD(S.slice(0, p)));
  }
  function strokeDone(){
    if (partial) partial.remove(); partial = null;
    const f = document.createElementNS(NS, 'path');
    f.setAttribute('class', 'fill'); f.style.stroke = color; f.setAttribute('d', pathD(strokes[cur]));
    fillsG.appendChild(f);
    const letterEnds = strokeLetter[cur + 1] !== strokeLetter[cur];
    cur++; p = 0;
    if (cur >= strokes.length) return complete();
    tone([784, 988], 0.07, 'triangle', 0.1);
    if (letterEnds && chars.length > 1) say(chars[strokeLetter[cur - 1]].toUpperCase(), null);
    drawHint();
  }
  function complete(){
    finished = true;
    activeG.innerHTML = ''; hintG.innerHTML = '';
    svg.classList.add('done');
    sfx.yay(); addStar(board);
    const [pe, pz] = pick(PRAISE), it = item();
    if (!isL || lastStep()) markWrite('word', board);
    if (!isL){
      say(`${pe} ${it.doneEn}`, `${pz}${it.doneZh}`);
      done.add(idx); store.set('trace.done.' + mode, [...done]);
      nextBtn.classList.add('ready');
    } else if (!lastStep()){
      say(`${pe} ${it.doneEn}`, `${pz}${it.doneZh}`);
      soon(startWrite, 2800);      // now write it alone 5 times
    } else {
      // the whole cycle for this letter is finished
      done.add(idx); store.set('trace.done.' + mode, [...done]);
      drawSteps();
      say(`${pe} ${it.doneEn} ${cyc.finishEn(idx)}`, `${pz}${cyc.finishZh(idx)}`);
      soon(() => cheer(`🏆 ${cyc.chips(idx).join(' ')}`, null, null), 2600);
      nextBtn.classList.add('ready');
    }
  }

  /* ----- write by yourself, 5 times, 1–3 stamps each ----- */
  const stampHTML = n => `<span class="stamps">${'<b class="stamp">★</b>'.repeat(n)}</span>`;
  function modelSVG(){
    return `<svg class="model" viewBox="${viewBox}">${strokes.map(s => `<path d="${pathD(s)}"/>`).join('')}</svg>`;
  }
  function drawSlots(){
    hintEl.innerHTML = `${modelSVG()}<div class="slots">${Array.from({length: WRITE_TIMES}, (_, i) =>
      `<div class="slot ${i === attempt && phase === 'write' ? 'now' : ''}">${results[i] ? stampHTML(results[i]) : i + 1}</div>`).join('')}</div>`;
  }
  function startWrite(){
    gen++; phase = 'write'; attempt = 0; results = []; writeStrokes = [];
    svg.classList.remove('done'); svg.classList.add('writing');
    inkG.innerHTML = '';
    board.querySelectorAll('.stamp-fx').forEach(e => e.remove());
    nextBtn.classList.remove('ready');
    okBtn.hidden = false; okBtn.classList.remove('ready');
    drawSlots();
    const it = item();
    say(`Now you write ${it.writeEn} by yourself. Five times! Tap done when you finish.`,
        `现在你自己写${it.writeZh}，写五次！写好了就点“写好了”。`);
  }
  function gradeAttempt(){
    if (phase !== 'write' || drawing) return;
    const g = gradeWriting(writeStrokes, strokes);
    if (!g.stamps){
      sfx.oops();
      return g.tiny ? say('Write it bigger!', '写大一点！') : say('Write the letter first!', '先写一写字母！');
    }
    phase = 'grading';
    okBtn.classList.remove('ready');
    results[attempt] = g.stamps;
    const fx = document.createElement('div');
    fx.className = 'stamp-fx';
    fx.innerHTML = `<div>${stampHTML(g.stamps)}<p>${['', 'Nice try!', 'Good job!', 'Perfect!'][g.stamps]}<span class="zh">${['', '加油！', '很好！', '太棒了！'][g.stamps]}</span></p></div>`;
    board.appendChild(fx);
    for (let i = 0; i < g.stamps; i++) setTimeout(() => tone([180, 120], 0.06, 'square', 0.12), 250 + i * 280);
    if (g.stamps === 3) setTimeout(() => { sfx.yay(); burst(fx.firstChild); }, 1100);
    // each stamp flies up into the star counter
    setTimeout(() => fx.isConnected && fx.querySelectorAll('.stamp').forEach((s, i) => flyStar(s, i * 220)), 1300);
    say(['', 'Nice try! Keep practicing!', 'Good job!', 'Perfect! Three stamps!'][g.stamps],
        ['', '不错，继续加油！', '写得很好！', '太棒了！三个印章！'][g.stamps]);
    drawSlots();
    soon(() => {
      fx.remove(); inkG.innerHTML = ''; writeStrokes = [];
      attempt++;
      if (attempt >= WRITE_TIMES) return summary();
      phase = 'write'; drawSlots();
      say(`Again! ${WRITE_TIMES - attempt} more.`, `再写一次！还有${NUM_ZH[WRITE_TIMES - attempt]}次。`);
    }, 2800);
  }
  function summary(){
    phase = 'summary'; okBtn.hidden = true;
    const total = results.reduce((a, b) => a + b, 0);
    const key = `${idx}-${step}`;
    if (!best[key] || total > best[key]){ best[key] = total; store.set('trace.best.' + mode, best); }
    drawSlots();
    const nextName = cyc.chips(idx)[step + 1];
    const nextEn = mode === 'letters' && step === 0 ? `little ${LETTERS[idx][0]}` : `the word ${nextName}`;
    const nextZh = mode === 'letters' && step === 0 ? `小写${LETTERS[idx][0]}` : `单词 ${nextName}`;
    // daily writing task: this counts as today's letter or number
    logToday(e => { e.trace += 1; });
    markWrite(mode === 'letters' ? 'letter' : 'number', board);
    const fx = document.createElement('div');
    fx.className = 'stamp-fx summary';
    fx.innerHTML = `<div><p class="big">🏅 ${total} <small>/ ${WRITE_TIMES * 3}</small></p>
      <p>You got ${total} stamps!<span class="zh">你得了${total}个印章！</span></p>
      <p class="sub">▶️ next: ${nextName} 下一步 · 🧽 write again 再写一遍</p></div>`;
    board.appendChild(fx);
    sfx.yay(); burst(fx.firstChild);
    say(`Wow! You got ${total} stamps! Tap the green arrow for ${nextEn}.`, `哇！你得了${total}个印章！点绿色箭头，下一个是${nextZh}。`);
    nextBtn.classList.add('ready');
  }
  function nudge(){
    const now = Date.now();
    const dot = hintG.querySelector('.start');
    if (dot){ dot.classList.remove('pulse'); void dot.getBoundingClientRect(); dot.classList.add('pulse'); }
    if (now - lastNudge < 5000) return;
    lastNudge = now;
    say(p === 0 ? 'Start at the green dot!' : 'Follow the dotted line!', p === 0 ? '从绿点开始！' : '沿着虚线走！');
  }
  function picker(){
    const ov = document.createElement('div'); ov.className = 'overlay';
    const cell = i => {
      if (!isL){ const [w,,e] = WORDS[i]; return `<span>${e}</span>${w}${done.has(i) ? '<i>⭐</i>' : ''}`; }
      return `${cyc.pick(i)}${done.has(i) ? '<i>🏆</i>' : ''}`;
    };
    ov.innerHTML = `<div class="card picker"><div class="pick-grid ${isL ? '' : 'words'}">${Array.from({length: count}, (_, i) =>
      `<button class="pick chunky ${i === idx ? 'cur' : ''}" data-i="${i}">${cell(i)}</button>`).join('')}</div>
      <div class="card-nav" style="justify-content:center"><button class="round chunky" data-x aria-label="Close">${IC.close}</button></div></div>`;
    ov.onclick = e => {
      const b = e.target.closest('.pick');
      if (b){ sfx.pop(); ov.remove(); load(+b.dataset.i); }
      else if (e.target === ov || e.target.closest('[data-x]')){ sfx.pop(); ov.remove(); }
    };
    document.body.appendChild(ov);
  }

  build(true);
}

/* ---------- MATH: one daily game, 20 questions, easy → hard ----------
   Plus and minus take turns in every part:
   1–5   + and − within 5   (pictures + 3 answer buttons)
   6–10  + and − within 10  (pictures + 3 answer buttons)
   11–15 + and − within 5   (he writes the answer)
   16–20 + and − within 10  (he writes the answer) */
const MATH_LEN = 20, MATH_CHOICE = 10;
// handwriting models for digits (same coordinates as capital letters)
const DIGITS = {
  0:G(72, arc(36,70,28,50,90,450)),
  1:G(56, ln(16,40,36,20,36,120)),
  2:G(72, st(arc(36,46,26,26,160,-40), ln(56,63,10,120,64,120))),
  3:G(68, st(arc(34,44,24,24,150,-90), arc(34,94,26,26,90,-150))),
  4:G(72, ln(46,20,8,88,66,88), ln(50,48,50,120)),
  5:G(70, st(ln(58,20,16,20,14,66), arc(34,92,26,28,130,-150))),
  6:G(72, st(arc(42,74,28,54,80,180), arc(38,94,24,26,180,540))),
  7:G(70, ln(8,20,62,20,26,120)),
  8:G(72, arc(36,44,22,24,90,450), arc(36,94,26,26,90,450)),
  9:G(72, st(arc(36,46,24,26,10,370), ln(60,42,58,120))),
};
function numberStrokes(str){
  let x = 0; const out = [];
  for (const ch of String(str)){ const g = DIGITS[ch]; g.s.forEach(s => out.push(s.map(([a, b]) => [a + x, b]))); x += g.w + 12; }
  return out;
}
// read a handwritten number 0..maxN: the model it matches best
function readNumber(ink, maxN = 10){
  let best = {v: -1, score: 0};
  for (let v = 0; v <= maxN; v++){
    const g = gradeWriting(ink, numberStrokes(v));
    if (g.score > best.score) best = {v, score: g.score};
  }
  return best;
}
function mathProblem(n){
  const sub = n % 2 === 1;                       // + − + − … all the way through
  const max = Math.floor(n / 5) % 2 === 0 ? 5 : 10; // within 5, then within 10 (for both halves)
  if (sub){ const a = 2 + rand(max - 1), b = 1 + rand(a - 1); return {a, b, op: '−', ans: a - b}; }
  const a = 1 + rand(max - 1), b = 1 + rand(max - a);
  return {a, b, op: '+', ans: a + b};
}
function mathScene(p, e){
  if (p.op === '−'){
    const items = Array.from({length: p.a}, (_, i) => `<span class="obj ${i >= p.ans ? 'gone' : ''}">${e}</span>`).join('');
    return `<div class="group-wrap"><div class="group">${items}</div></div>`;
  }
  const g = n => `<div class="group-wrap"><div class="group">${Array.from({length: n}, () => `<span class="obj">${e}</span>`).join('')}</div><div class="group-num">${n}</div></div>`;
  return `${g(p.a)}<div class="op">+</div>${g(p.b)}<div class="op">=</div><div class="q">?</div>`;
}
const mathSay = p => p.op === '+'
  ? [`${NUM_EN[p.a]} plus ${NUM_EN[p.b]} equals?`, `${NUM_ZH[p.a]}加${NUM_ZH[p.b]}等于几？`]
  : [`${NUM_EN[p.a]} take away ${NUM_EN[p.b]}. How many are left?`, `${NUM_ZH[p.a]}减${NUM_ZH[p.b]}，还剩几个？`];
const mathYes = p => p.op === '+'
  ? [`${p.a} plus ${p.b} is ${p.ans}!`, `${NUM_ZH[p.a]}加${NUM_ZH[p.b]}等于${NUM_ZH[p.ans]}！`]
  : [`${p.a} take away ${p.b} is ${p.ans}!`, `${NUM_ZH[p.a]}减${NUM_ZH[p.b]}等于${NUM_ZH[p.ans]}！`];

/* a small handwriting pad; returns its strokes (lists of points) */
let penSeenGlobal = false;
function inkPad(el, onInk){
  const NS = 'http://www.w3.org/2000/svg';
  el.innerHTML = `<svg viewBox="0 0 110 140" preserveAspectRatio="xMidYMid meet">
    <line x1="-500" x2="600" y1="20" y2="20" class="ln"/><line x1="-500" x2="600" y1="70" y2="70" class="ln ln-mid"/>
    <line x1="-500" x2="600" y1="120" y2="120" class="ln ln-base"/><g class="t-ink"></g></svg>`;
  const svg = el.firstElementChild, inkG = svg.querySelector('.t-ink');
  let strokes = [], dr = null;
  const toLocal = e => { const m = svg.getScreenCTM().inverse(); return [m.a*e.clientX + m.c*e.clientY + m.e, m.b*e.clientX + m.d*e.clientY + m.f]; };
  const addPt = pt => {
    const last = dr.pts[dr.pts.length - 1];
    if (last && Math.hypot(pt[0] - last[0], pt[1] - last[1]) < 1) return;
    dr.pts.push(pt);
    dr.path.setAttribute('d', pathD(dr.pts) + (dr.pts.length === 1 ? ' l0.01 0' : ''));
  };
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeenGlobal = true;
    else if (e.pointerType === 'touch' && penSeenGlobal) return;
    if (dr || el.classList.contains('locked')) return;
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    const path = document.createElementNS(NS, 'path'); path.setAttribute('class', 'ink'); path.style.stroke = '#7048e8';
    inkG.appendChild(path);
    dr = {id: e.pointerId, path, pts: []}; addPt(toLocal(e));
  });
  svg.addEventListener('pointermove', e => {
    if (!dr || e.pointerId !== dr.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => addPt(toLocal(ev)));
  });
  const end = e => { if (!dr || e.pointerId !== dr.id) return; strokes.push(dr.pts); dr = null; onInk && onInk(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return { get strokes(){ return strokes; }, clear(){ strokes = []; inkG.innerHTML = ''; } };
}

function mathHome(){
  navigate(); curSection = 'math';
  const g = store.get('math.game', null), played = !!(g && g.d === todayKey());
  $app.innerHTML = `${wordsHeader('Math', '数学')}
    <main class="stage">
      <div class="cheer-card">
        <div class="wc-emoji">${played ? '✅' : '🧮'}</div>
        <p class="big-txt">${played ? `Today: ${g.score} / ${MATH_LEN}` : "Today's math game"}<span class="zh">${played ? `今天答对了${g.score}题` : '今天的数学游戏'}</span></p>
        <p class="sub-txt">${MATH_LEN} questions · easy → hard · last ${MATH_LEN - MATH_CHOICE}: write the answer ✏️<br>${MATH_LEN}道题 · 由易到难 · 后${MATH_LEN - MATH_CHOICE}道自己写答案</p>
        <button class="ok-btn chunky" id="goMath">${played ? '🔁 Play again' : '▶️ Start'}<span class="zh">${played ? '再玩一次' : '开始'}</span></button>
      </div>
    </main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  document.getElementById('goMath').onclick = () => { sfx.pop(); mathGame(); };
  say(played ? `You already did today's math. Great job!` : `Let's do today's math! ${MATH_LEN} questions.`,
      played ? '今天的数学做完了，真棒！' : `我们来做今天的数学吧！${MATH_LEN}道题。`);
}

function mathGame(){
  navigate(); curSection = 'math';
  $app.innerHTML = `${wordsHeader("Today's math", '今日数学')}<main id="stage" class="stage"></main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  const stage = document.getElementById('stage');
  let n = 0, score = 0;
  const dots = () => `<div class="dots small">${Array.from({length: MATH_LEN}, (_, k) =>
    `<span class="${k < n ? 'past' : k === n ? 'now' : ''} ${k === MATH_CHOICE ? 'gap' : ''}"></span>`).join('')}</div>`;
  const next = () => { n++; n < MATH_LEN ? ask() : finish(); };
  function right(el, p){
    score++; sfx.yay(); burst(el); flyStar(el, 200);       // star as soon as he gets it right
    const [pe, pz] = pick(PRAISE), [ye, yz] = mathYes(p);
    say(`${pe} ${ye}`, `${pz}${yz}`);
    later(next, 2300);
  }
  function ask(){ n < MATH_CHOICE ? askChoice() : askWrite(); }

  function askChoice(){
    const p = mathProblem(n), e = pick(THINGS), [en, zh] = mathSay(p);
    const opts = nearbyNumbers(p.ans, 3, p.op === '+' ? 1 : 0, 10);
    stage.innerHTML = `${dots()}
      <div class="prompt"><button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
        <div class="prompt-text">${p.a} ${p.op} ${p.b} = ?<span class="zh">${zh}</span></div></div>
      <div class="scene">${mathScene(p, e)}</div>
      <div class="choices">${opts.map(x => `<button class="choice chunky" data-v="${x}">${x}<small>${NUM_ZH[x]}</small></button>`).join('')}</div>`;
    stage.querySelector('.speak').onclick = () => { sfx.pop(); say(en, zh); };
    say(en, zh);
    let locked = false;
    stage.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked || b.disabled) return;
      if (+b.dataset.v === p.ans){ locked = true; b.classList.add('right'); right(b, p); }
      else { b.classList.add('wrong'); b.disabled = true; sfx.oops(); say('Try again!', '再试一次！'); }
    });
  }

  function askWrite(){
    const p = mathProblem(n), e = pick(THINGS), [en, zh] = mathSay(p);
    let tries = 0, locked = false;
    stage.innerHTML = `${dots()}
      <div class="prompt"><button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
        <div class="prompt-text">Write the answer!<span class="zh">自己写答案！</span></div></div>
      <div class="write-row">
        <div class="eq">${p.a} ${p.op} ${p.b} =</div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="scene hint-scene" hidden>${mathScene(p, e)}</div>
      <div class="toolbar">
        <button class="round chunky" id="mHint" aria-label="Show pictures">${IC.bulb}</button>
        <button class="round chunky" id="mClear" aria-label="Erase">${IC.erase}</button>
        <button class="ok-btn chunky" id="mOk">✅ Check<span class="zh">检查</span></button>
      </div>`;
    const padEl = stage.querySelector('#pad'), okBtn = stage.querySelector('#mOk');
    const pad = inkPad(padEl, () => okBtn.classList.add('ready'));
    stage.querySelector('.speak').onclick = () => { sfx.pop(); say(`${en} Write the answer!`, `${zh}写出答案！`); };
    stage.querySelector('#mHint').onclick = () => { sfx.pop(); stage.querySelector('.hint-scene').hidden = false; };
    stage.querySelector('#mClear').onclick = () => { sfx.pop(); pad.clear(); okBtn.classList.remove('ready'); };
    say(`${en} Write the answer!`, `${zh}写出答案！`);
    okBtn.onclick = () => {
      if (locked) return;
      if (!pad.strokes.length) return say('Write your answer first!', '先写答案！');
      sfx.pop();
      const read = readNumber(pad.strokes, 10);
      const mine = gradeWriting(pad.strokes, numberStrokes(p.ans));
      // lenient for little hands: right if it reads as the answer, or looks close enough to it
      const ok = read.v === p.ans || (mine.score >= 0.55 && mine.score >= read.score - 0.08);
      if (ok){ locked = true; padEl.classList.add('locked', 'good'); okBtn.classList.remove('ready'); right(padEl, p); return; }
      tries++; sfx.oops(); okBtn.classList.remove('ready');
      if (tries < 2){
        padEl.classList.add('shake'); setTimeout(() => padEl.classList.remove('shake'), 450);
        stage.querySelector('.hint-scene').hidden = false;
        say("Hmm, let's try again. Count the pictures!", '嗯，再试一次，数一数图片！');
        pad.clear();
      } else {
        locked = true; padEl.classList.add('locked');
        padEl.insertAdjacentHTML('beforeend', `<div class="pad-ans">${p.ans}</div>`);
        const [ye, yz] = mathYes(p);
        say(`The answer is ${p.ans}. ${ye}`, `答案是${NUM_ZH[p.ans]}。${yz}`);
        later(next, 3200);
      }
    };
  }

  function finish(){
    const prev = store.get('math.game', null);
    const bestToday = prev && prev.d === todayKey() ? Math.max(prev.score, score) : score;
    store.set('math.game', {d: todayKey(), score: bestToday});
    logToday(e => { e.math = Math.max(e.math || 0, score); });
    later(() => taskBonus('math', stage.querySelector('.cheer-card')), 50);
    stage.innerHTML = `<div class="cheer-card">
      <div class="wc-emoji">${score >= 16 ? '🏆' : score >= 10 ? '🥈' : '💪'}</div>
      <p class="big-txt">${score} / ${MATH_LEN}<span class="zh">答对了${score}题</span></p>
      <p class="sub-txt">Today's math is done! ✅ 今天的数学完成了！</p>
      <button class="ok-btn chunky" id="toHome">🏠 Home<span class="zh">回家</span></button></div>`;
    sfx.yay(); burst(stage.querySelector('.cheer-card'));
    say(`You got ${score} out of ${MATH_LEN}! Today's math is done!`, `你答对了${score}题！今天的数学完成啦！`);
    document.getElementById('toHome').onclick = () => { sfx.pop(); home(); };
  }
  ask();
}
