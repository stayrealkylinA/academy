const EASY = {
  A:['ant','蚂蚁','🐜'], B:['bus','公共汽车','🚌'], C:['cat','猫','🐱'], D:['dog','狗','🐶'], E:['egg','鸡蛋','🥚'],
  F:['fox','狐狸','🦊'], G:['goat','山羊','🐐'], H:['hat','帽子','🎩'], I:['ice','冰','🧊'], J:['jam','果酱','🍓'],
  K:['kite','风筝','🪁'], L:['lion','狮子','🦁'], M:['moon','月亮','🌙'], N:['nest','鸟窝','🪺'], O:['owl','猫头鹰','🦉'],
  P:['pig','猪','🐷'], Q:['queen','女王','👸'], R:['red','红色','🔴'], S:['sun','太阳','☀️'], T:['tree','树','🌳'],
  U:['up','上','⬆️'], V:['van','面包车','🚐'], W:['web','蜘蛛网','🕸️'], X:['box','盒子','📦'], Y:['yes','是','✅'],
  Z:['zoo','动物园','🦒'],
};
function wordItem(w, zh, e, L){
  return {
    text: w, emo: e, label: w,
    hint: `<span class="emo">${e}</span><b>${w}</b><span class="zh">${zh}</span>`,
    en: L ? `Now a word with ${L}: ${w}! Let's trace it.` : `Let's trace ${w}!`,
    zh: L ? `${L}的单词：${zh}，描一描！` : `描一描，${zh}`,
    doneEn: `${spellOut(w)} ${w}!`, doneZh: `${zh}！`
  };
}
// step 0 = big letter, 1 = little letter, 2 = easy word
function letterStep(i, step){
  const [L, w, zh, e] = LETTERS[i];
  if (step === 2){ const [ew, ezh, ee] = EASY[L]; return wordItem(ew, ezh, ee, L); }
  const big = step === 0;
  return {
    text: big ? L : L.toLowerCase(), emo: e, label: big ? L : L.toLowerCase(),
    hint: `<span class="emo">${e}</span><b>${w}</b><span class="zh">${zh}</span>`,
    en: big ? `Trace big ${L}.` : `Now little ${L}. Trace little ${L}.`,
    zh: big ? `描一描大写字母${L}` : `现在是小写${L}，描一描！`,
    writeEn: big ? `big ${L}` : `little ${L}`, writeZh: big ? `大写${L}` : `小写${L}`,
    doneEn: `${L}! ${w}!`, doneZh: zh
  };
}

// numbers cycle: step 0 = digit (trace + write 5x), step 1 = its word
function numberStep(i, step){
  const n = i + 1;
  if (step === 1) return {
    text: NUM_EN[n], emo: String(n), label: NUM_EN[n],
    hint: `<b>${n}</b><span class="emo">➜</span><b>${NUM_EN[n]}</b><span class="zh">${NUM_ZH[n]}</span>`,
    en: `Now the word ${NUM_EN[n]}! Let's trace it.`, zh: `现在描一描单词 ${NUM_EN[n]}，${NUM_ZH[n]}！`,
    doneEn: `${spellOut(NUM_EN[n])} ${NUM_EN[n]}!`, doneZh: `${NUM_ZH[n]}！`
  };
  return {
    text: String(n), emo: String(n), label: String(n),
    hint: `<span class="emo">${THINGS[i % THINGS.length].repeat(Math.min(n, 5))}${n > 5 ? '…' : ''}</span><b>${NUM_EN[n]}</b><span class="zh">${NUM_ZH[n]}</span>`,
    en: `Trace the number ${NUM_EN[n]}.`, zh: `描一描数字${NUM_ZH[n]}`,
    writeEn: `the number ${n}`, writeZh: `数字${NUM_ZH[n]}`,
    doneEn: `${NUM_EN[n]}!`, doneZh: NUM_ZH[n]
  };
}
const CYCLES = {
  letters: { count: 26, steps: 3, item: letterStep,
    chips: i => { const L = LETTERS[i][0]; return [L, L.toLowerCase(), EASY[L][0]]; },
    finishEn: i => `You finished the letter ${LETTERS[i][0]}!`, finishZh: i => `字母${LETTERS[i][0]}全部完成啦！`,
    pick: i => LETTERS[i][0] + LETTERS[i][0].toLowerCase() },
  numbers: { count: 10, steps: 2, item: numberStep,
    chips: i => [String(i + 1), NUM_EN[i + 1]],
    finishEn: i => `You finished number ${NUM_EN[i + 1]}!`, finishZh: i => `数字${NUM_ZH[i + 1]}全部完成啦！`,
    pick: i => String(i + 1) },
};

function traceScreen(stage, mode){
  if (!CYCLES[mode] && mode !== 'words') mode = 'letters';
  store.set('trace.mode', mode);
  const cyc = CYCLES[mode], isL = !!cyc;   // isL: a step-by-step cycle (letters or numbers)
  const count = isL ? cyc.count : WORDS.length;
  let idx = Math.min(store.get('trace.idx.' + mode, 0), count - 1);
  let step = isL ? Math.min(store.get('trace.step.' + mode, 0), cyc.steps - 1) : 0;
  const item = () => isL ? cyc.item(idx, step) : wordItem(...WORDS[idx]);
  const lastStep = () => isL && step === cyc.steps - 1;
  let done = new Set(store.get('trace.done.' + mode, []));   // letters: whole cycle finished
  let color = store.get('trace.color', CRAYONS[0]);
  let penSeen = false, drawing = null, lastNudge = 0;
  let strokes, samples, strokeLetter, chars, cur, p, finished, svg, fillsG, activeG, hintG, inkG, partial, viewBox;
  // write-by-yourself phase
  const WRITE_TIMES = 5;
  let phase = 'trace', gen = 0, attempt = 0, results = [], writeStrokes = [], traceInk = [];
  let best = store.get('trace.best.' + mode, {}); // "idx-step" -> best total stamps (out of 15)
  const soon = (fn, ms) => { const g = gen; later(() => { if (g === gen) fn(); }, ms); };
  const NS = 'http://www.w3.org/2000/svg';

  stage.classList.add('trace');
  stage.innerHTML = `
    <div class="trace-top">
      <button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
      ${isL ? '<div class="steps" id="tSteps"></div>' : ''}
      <div class="trace-hint" id="tHint"></div>
    </div>
    <div class="board" id="board"></div>
    <div class="toolbar">
      <button class="round chunky" id="tPrev" aria-label="Previous">${IC.prev}</button>
      <button class="round chunky" id="tPick" aria-label="Choose">${IC.grid}</button>
      <button class="round chunky" id="tClear" aria-label="Erase">${IC.erase}</button>
      <div class="crayons">${CRAYONS.map(c => `<button class="crayon ${c===color?'on':''}" data-c="${c}" style="--c:${c}" aria-label="Color"></button>`).join('')}</div>
      <button class="ok-btn chunky" id="tOk" hidden aria-label="I'm done">✅ Done<span class="zh">写好了</span></button>
      <button class="round chunky" id="tNext" aria-label="Next">${IC.next}</button>
    </div>`;
  const board = stage.querySelector('#board'), hintEl = stage.querySelector('#tHint'), nextBtn = stage.querySelector('#tNext');
  const stepsEl = stage.querySelector('#tSteps');
  const nav = document.querySelector('.modes');
  if (nav && !document.getElementById('writeStrip')){ nav.insertAdjacentHTML('beforeend', '<div class="write-strip" id="writeStrip"></div>'); drawWriteStrip(); }
  stage.querySelector('.speak').onclick = () => { sfx.pop(); const it = item(); say(it.en, it.zh); };
  stage.querySelector('#tPrev').onclick = () => { sfx.pop(); load(idx - 1); };
  nextBtn.onclick = () => {
    sfx.pop();
    // inside a letter cycle, the glowing arrow continues to the next step
    if (isL && !lastStep() && phase === 'summary') goStep(step + 1);
    else load(idx + 1);
  };
  const okBtn = stage.querySelector('#tOk');
  okBtn.onclick = () => { sfx.pop(); gradeAttempt(); };
  stage.querySelector('#tClear').onclick = () => {
    sfx.pop();
    if (phase === 'trace') build(false);
    else if (phase === 'write'){ inkG.innerHTML = ''; writeStrokes = []; okBtn.classList.remove('ready'); }
    else if (phase === 'summary') startWrite();   // write 5 more times
  };
  stage.querySelector('#tPick').onclick = () => { sfx.pop(); picker(); };
  hintEl.onclick = () => { const b = hintEl.querySelector('b'); if (b){ sfx.pop(); sayWord(b.textContent.trim()); } };
  stage.querySelectorAll('.crayon').forEach(b => b.onclick = () => {
    color = b.dataset.c; store.set('trace.color', color); sfx.pop();
    stage.querySelectorAll('.crayon').forEach(x => x.classList.toggle('on', x === b));
    if (partial) partial.style.stroke = color;
  });

  function load(i){
    idx = (i + count) % count; step = 0;
    store.set('trace.idx.' + mode, idx); if (isL) store.set('trace.step.' + mode, 0);
    build(true);
  }
  function goStep(s){ step = s; store.set('trace.step.' + mode, s); build(true); }
  function drawSteps(){
    if (!stepsEl) return;
    const last = cyc.steps - 1;
    stepsEl.innerHTML = cyc.chips(idx).map((t, i) =>
      `<span class="chip ${i < step || (i === last && step === last && finished) ? 'ok' : i === step ? 'now' : ''}">${t}</span>`
    ).join('<span class="arr">›</span>');
  }

  function build(speak){
    const it = item();
    hintEl.innerHTML = it.hint;
    nextBtn.classList.remove('ready');
    chars = it.text.split('');
    strokes = []; strokeLetter = [];
    let x = 0;
    chars.forEach((ch, ci) => {
      const g = GLYPHS[ch] || DIGITS[ch];
      g.s.forEach(s => { strokes.push(s.map(([a, b]) => [a + x, b])); strokeLetter.push(ci); });
      x += g.w + 12;
    });
    const W = x - 12;
    const lower = chars.some(c => c !== c.toUpperCase());
    const desc = chars.some(c => 'gjpqy'.includes(c));
    const top = 6, bottom = desc ? 172 : 134;
    const lines = lower
      ? [[20,'top'],[60,'mid'],[120,'base']].concat(desc ? [[160,'desc']] : [])
      : [[20,'top'],[70,'mid'],[120,'base']];
    samples = strokes.map(samplePts);
    cur = 0; p = 0; finished = false; drawing = null; traceInk = [];
    gen++; phase = 'trace'; writeStrokes = [];
    okBtn.hidden = true; okBtn.classList.remove('ready');
    viewBox = `-22 ${top} ${W + 44} ${bottom - top}`;
    board.innerHTML = `<svg viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet">
      <g>${lines.map(([y, c]) => `<line x1="-3000" x2="3000" y1="${y}" y2="${y}" class="ln ln-${c}"/>`).join('')}</g>
      <g class="guide">${strokes.map(s => `<path d="${pathD(s)}" class="g-bed"/>`).join('')}</g>
      <g class="t-active guide"></g>
      <g class="t-fills guide"></g>
      <g class="guide">${strokes.map(s => `<path d="${pathD(s)}" class="g-dash"/>`).join('')}</g>
      <g class="t-ink"></g>
      <g class="t-hint guide"></g>
    </svg>`;
    svg = board.firstElementChild;
    activeG = svg.querySelector('.t-active'); fillsG = svg.querySelector('.t-fills');
    inkG = svg.querySelector('.t-ink'); hintG = svg.querySelector('.t-hint');
    partial = null;
    svg.addEventListener('pointerdown', down);
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);
    drawSteps();
    drawHint();
    if (speak) say(it.en, it.zh);
  }

  function drawHint(){
    const S = samples[cur], s = strokes[cur], d = pathD(s);
    activeG.innerHTML = `<path d="${d}" class="g-active"/>`;
    // stroke number within the current letter
    let num = 1; for (let k = cur - 1; k >= 0 && strokeLetter[k] === strokeLetter[cur]; k--) num++;
    let h = '';
    if (p === 0 && S.length > 4){
      const len = S.length * 3;
      h += `<circle r="6" class="ghost"><animateMotion dur="${Math.max(1.2, len / 90).toFixed(2)}s" repeatCount="indefinite" path="${d}"/></circle>`;
    }
    if (S.length > 12){
      const a = S[10], b = S[Math.min(14, S.length - 1)];
      const deg = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
      h += `<g transform="translate(${a[0].toFixed(1)} ${a[1].toFixed(1)}) rotate(${deg.toFixed(0)})"><path d="M-6 -7 L8 0 L-6 7 Z" class="arrow"/></g>`;
    }
    if (p === 0) h += `<circle cx="${S[0][0].toFixed(1)}" cy="${S[0][1].toFixed(1)}" r="10" class="start"/><text x="${S[0][0].toFixed(1)}" y="${(S[0][1] + 4.5).toFixed(1)}" class="num">${num}</text>`;
    hintG.innerHTML = h;
  }

  function toLocal(e){
    const m = svg.getScreenCTM().inverse();
    return [m.a*e.clientX + m.c*e.clientY + m.e, m.b*e.clientX + m.d*e.clientY + m.f];
  }
  function down(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return; // palm rejection once a pencil is used
    if (drawing) return;
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'ink'); path.style.stroke = color; inkG.appendChild(path);
    drawing = {id: e.pointerId, path, d: '', last: null, len: 0, startCur: cur, startP: p, pts: []};
    add(toLocal(e));
  }
  function move(e){
    if (!drawing || e.pointerId !== drawing.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => add(toLocal(ev)));
  }
  function up(e){
    if (!drawing || e.pointerId !== drawing.id) return;
    const dr = drawing; drawing = null;
    if (phase === 'write'){
      if (dr.pts.length){ writeStrokes.push(dr.pts); okBtn.classList.add('ready'); }
      return;
    }
    if (!finished && dr.startCur === cur && dr.startP === p && dr.len > 30){
      dr.path.classList.add('fade'); setTimeout(() => dr.path.remove(), 600);
      nudge();
    }
  }
  function add(pt){
    const dr = drawing; if (!dr) return;
    if (phase === 'summary' || phase === 'grading') return;
    dr.pts.push(pt);
    if (phase === 'trace') traceInk.push(pt);
    if (!dr.last){
      dr.d = `M${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`;
      dr.path.setAttribute('d', dr.d + ' l0.01 0');
      dr.last = pt; advance(pt); return;
    }
    const [lx, ly] = dr.last, dist = Math.hypot(pt[0] - lx, pt[1] - ly);
    if (dist < 1.2) return;
    dr.len += dist;
    dr.d += ` L${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`;
    dr.path.setAttribute('d', dr.d);
    dr.last = pt;
    const n = Math.ceil(dist / 2);
    for (let k = 1; k <= n; k++) advance([lx + (pt[0] - lx)*k/n, ly + (pt[1] - ly)*k/n]);
  }
  function advance(pt){
    if (finished || phase !== 'trace') return;
    const S = samples[cur], lim = Math.min(S.length - 1, p + TRACE_LOOK);
    const before = p;
    for (let j = p; j <= lim; j++) if (Math.hypot(S[j][0] - pt[0], S[j][1] - pt[1]) < TRACE_TOL) p = j + 1;
    if (p === before) return;
    if (p >= S.length) return strokeDone();
    if (before === 0) drawHint(); // hide the start dot + ghost once he has started
    if (!partial){
      partial = document.createElementNS(NS, 'path');
      partial.setAttribute('class', 'fill'); partial.style.stroke = color; fillsG.appendChild(partial);
    }
    partial.setAttribute('d', pathD(S.slice(0, p)));
  }
  function strokeDone(){
    if (partial) partial.remove(); partial = null;
    const f = document.createElementNS(NS, 'path');
    f.setAttribute('class', 'fill'); f.style.stroke = color; f.setAttribute('d', pathD(strokes[cur]));
    fillsG.appendChild(f);
    const letterEnds = strokeLetter[cur + 1] !== strokeLetter[cur];
    cur++; p = 0;
    if (cur >= strokes.length) return complete();
    tone([784, 988], 0.07, 'triangle', 0.1);
    if (letterEnds && chars.length > 1) say(letterName(chars[strokeLetter[cur - 1]]), null);
    drawHint();
  }
  // share of his ink that stayed on the dotted path (0..1)
  function neatness(){
    const all = [].concat(...samples), R = NEAT_TOL * NEAT_TOL;
    if (!traceInk.length) return 1;
    let near = 0;
    for (const [x, y] of traceInk){
      for (const [u, v] of all){ if ((x - u) * (x - u) + (y - v) * (y - v) < R){ near++; break; } }
    }
    return near / traceInk.length;
  }
  function complete(){
    finished = true;
    activeG.innerHTML = ''; hintG.innerHTML = '';
    svg.classList.add('done');
    let [pe, pz] = pick(PRAISE); const it = item();
    const isWord = !isL || lastStep();
    if (isWord){
      // words: 0-2 stars for how neatly he traced
      const neat = neatness(), n = neat >= NEAT_2 ? 2 : neat >= NEAT_1 ? 1 : 0;
      sfx.yay();
      for (let i = 0; i < n; i++) flyStar(board, 300 + i * 260);
      const fx = document.createElement('div'); fx.className = 'neat-fx n' + n;
      fx.innerHTML = n === 2 ? '⭐⭐ Super neat! <span class="zh">描得真整齐！</span>'
        : n === 1 ? '⭐ Good! <span class="zh">不错！</span>' : 'Try to stay on the dotted line 尽量描在虚线上';
      board.appendChild(fx); setTimeout(() => fx.remove(), 2600);
      if (!n){ pe = 'Nice try!'; pz = '不错的尝试！'; }
      markWrite('word', board);
    } else { sfx.yay(); addStar(board); }
    if (!isL){
      say(`${pe} ${it.doneEn}`, `${pz}${it.doneZh}`);
      const tw = todayLog();
      if (!(tw.tw || {}).word){
        const left = WRITE_WORDS - Math.min(tw.twWords || 0, WRITE_WORDS);
        if (left) later(() => say(`${left} more word${left === 1 ? '' : 's'} today!`, `今天还有${left}个单词！`), 2600);
      }
      done.add(idx); store.set('trace.done.' + mode, [...done]);
      nextBtn.classList.add('ready');
    } else if (!lastStep()){
      say(`${pe} ${it.doneEn}`, `${pz}${it.doneZh}`);
      soon(startWrite, 2800);      // now write it alone 5 times
    } else {
      // the whole cycle for this letter is finished
      done.add(idx); store.set('trace.done.' + mode, [...done]);
      drawSteps();
      say(`${pe} ${it.doneEn} ${cyc.finishEn(idx)}`, `${pz}${cyc.finishZh(idx)}`);
      soon(() => cheer(`🏆 ${cyc.chips(idx).join(' ')}`, null, null), 2600);
      nextBtn.classList.add('ready');
    }
  }

  /* ----- write by yourself, 5 times, 1–3 stamps each ----- */
  const stampHTML = n => `<span class="stamps">${'<b class="stamp">★</b>'.repeat(n)}</span>`;
  function modelSVG(){
    return `<svg class="model" viewBox="${viewBox}">${strokes.map(s => `<path d="${pathD(s)}"/>`).join('')}</svg>`;
  }
  function drawSlots(){
    hintEl.innerHTML = `${modelSVG()}<div class="slots">${Array.from({length: WRITE_TIMES}, (_, i) =>
      `<div class="slot ${i === attempt && phase === 'write' ? 'now' : ''}">${results[i] ? stampHTML(results[i]) : i + 1}</div>`).join('')}</div>`;
  }
  function startWrite(){
    gen++; phase = 'write'; attempt = 0; results = []; writeStrokes = [];
    svg.classList.remove('done'); svg.classList.add('writing');
    inkG.innerHTML = '';
    board.querySelectorAll('.stamp-fx').forEach(e => e.remove());
    nextBtn.classList.remove('ready');
    okBtn.hidden = false; okBtn.classList.remove('ready');
    drawSlots();
    const it = item();
    say(`Now you write ${it.writeEn} by yourself. Five times! Tap done when you finish.`,
        `现在你自己写${it.writeZh}，写五次！写好了就点“写好了”。`);
  }
  function gradeAttempt(){
    if (phase !== 'write' || drawing) return;
    const g = gradeWriting(writeStrokes, strokes);
    if (!g.stamps){
      sfx.oops();
      return g.tiny ? say('Write it bigger!', '写大一点！') : say('Write the letter first!', '先写一写字母！');
    }
    phase = 'grading';
    okBtn.classList.remove('ready');
    results[attempt] = g.stamps;
    const fx = document.createElement('div');
    fx.className = 'stamp-fx';
    fx.innerHTML = `<div>${stampHTML(g.stamps)}<p>${['', 'Nice try!', 'Good job!', 'Perfect!'][g.stamps]}<span class="zh">${['', '加油！', '很好！', '太棒了！'][g.stamps]}</span></p></div>`;
    board.appendChild(fx);
    for (let i = 0; i < g.stamps; i++) setTimeout(() => tone([180, 120], 0.06, 'square', 0.12), 250 + i * 280);
    if (g.stamps === 3) setTimeout(() => { sfx.yay(); burst(fx.firstChild); }, 1100);
    // each stamp flies up into the star counter
    setTimeout(() => fx.isConnected && fx.querySelectorAll('.stamp').forEach((s, i) => flyStar(s, i * 220)), 1300);
    say(['', 'Nice try! Keep practicing!', 'Good job!', 'Perfect! Three stamps!'][g.stamps],
        ['', '不错，继续加油！', '写得很好！', '太棒了！三个印章！'][g.stamps]);
    drawSlots();
    soon(() => {
      fx.remove(); inkG.innerHTML = ''; writeStrokes = [];
      attempt++;
      if (attempt >= WRITE_TIMES) return summary();
      phase = 'write'; drawSlots();
      say(`Again! ${WRITE_TIMES - attempt} more.`, `再写一次！还有${NUM_ZH[WRITE_TIMES - attempt]}次。`);
    }, 2800);
  }
  function summary(){
    phase = 'summary'; okBtn.hidden = true;
    const total = results.reduce((a, b) => a + b, 0);
    const key = `${idx}-${step}`;
    if (!best[key] || total > best[key]){ best[key] = total; store.set('trace.best.' + mode, best); }
    drawSlots();
    const nextName = cyc.chips(idx)[step + 1];
    const nextEn = mode === 'letters' && step === 0 ? `little ${LETTERS[idx][0]}` : `the word ${nextName}`;
    const nextZh = mode === 'letters' && step === 0 ? `小写${LETTERS[idx][0]}` : `单词 ${nextName}`;
    // daily writing task: this counts as today's letter or number
    logToday(e => { e.trace += 1; });
    markWrite(mode === 'letters' ? 'letter' : 'number', board);
    const fx = document.createElement('div');
    fx.className = 'stamp-fx summary';
    fx.innerHTML = `<div><p class="big">🏅 ${total} <small>/ ${WRITE_TIMES * 3}</small></p>
      <p>You got ${total} stamps!<span class="zh">你得了${total}个印章！</span></p>
      <p class="sub">▶️ next: ${nextName} 下一步 · 🧽 write again 再写一遍</p></div>`;
    board.appendChild(fx);
    sfx.yay(); burst(fx.firstChild);
    say(`Wow! You got ${total} stamps! Tap the green arrow for ${nextEn}.`, `哇！你得了${total}个印章！点绿色箭头，下一个是${nextZh}。`);
    nextBtn.classList.add('ready');
  }
  function nudge(){
    const now = Date.now();
    const dot = hintG.querySelector('.start');
    if (dot){ dot.classList.remove('pulse'); void dot.getBoundingClientRect(); dot.classList.add('pulse'); }
    if (now - lastNudge < 5000) return;
    lastNudge = now;
    say(p === 0 ? 'Start at the green dot!' : 'Follow the dotted line!', p === 0 ? '从绿点开始！' : '沿着虚线走！');
  }
  function picker(){
    const ov = document.createElement('div'); ov.className = 'overlay';
    const cell = i => {
      if (!isL){ const [w,,e] = WORDS[i]; return `<span>${e}</span>${w}${done.has(i) ? '<i>⭐</i>' : ''}`; }
      return `${cyc.pick(i)}${done.has(i) ? '<i>🏆</i>' : ''}`;
    };
    ov.innerHTML = `<div class="card picker"><div class="pick-grid ${isL ? '' : 'words'}">${Array.from({length: count}, (_, i) =>
      `<button class="pick chunky ${i === idx ? 'cur' : ''}" data-i="${i}">${cell(i)}</button>`).join('')}</div>
      <div class="card-nav" style="justify-content:center"><button class="round chunky" data-x aria-label="Close">${IC.close}</button></div></div>`;
    ov.onclick = e => {
      const b = e.target.closest('.pick');
      if (b){ sfx.pop(); ov.remove(); load(+b.dataset.i); }
      else if (e.target === ov || e.target.closest('[data-x]')){ sfx.pop(); ov.remove(); }
    };
    document.body.appendChild(ov);
  }

  build(true);
}

/* ---------- MATH: one daily game, 20 questions, easy → hard ----------
   Plus and minus take turns in every part:
   1–5   + and − within 5   (pictures + 3 answer buttons)
   6–10  + and − within 10  (pictures + 3 answer buttons)
   11–15 + and − within 5   (he writes the answer)
   16–20 + and − within 10  (he writes the answer) */
const MATH_LEN = 20, MATH_CHOICE = 10;
// handwriting models for digits (same coordinates as capital letters)
const DIGITS = {
  0:G(72, arc(36,70,28,50,90,450)),
  1:G(56, ln(16,40,36,20,36,120)),
  2:G(72, st(arc(36,46,26,26,160,-40), ln(56,63,10,120,64,120))),
  3:G(68, st(arc(34,44,24,24,150,-90), arc(34,94,26,26,90,-150))),
  4:G(72, ln(46,20,8,88,66,88), ln(50,48,50,120)),
  5:G(70, st(ln(58,20,16,20,14,66), arc(34,92,26,28,130,-150))),
  6:G(72, st(arc(42,74,28,54,80,180), arc(38,94,24,26,180,540))),
  7:G(70, ln(8,20,62,20,26,120)),
  8:G(72, arc(36,44,22,24,90,450), arc(36,94,26,26,90,450)),
  9:G(72, st(arc(36,46,24,26,10,370), ln(60,42,58,120))),
};
// other common ways little kids write numbers
const DIGIT_ALTS = {
  0: [G(56, arc(28,70,22,50,90,450))],                                                     // narrow 0
  1: [G(40, ln(20,20,20,120)), G(56, ln(14,40,34,20,34,120), ln(14,120,54,120))],          // plain stick; with a base
  2: [G(72, st(arc(36,46,26,26,170,-20), ln(60,56,10,120,64,120)))],
  3: [G(68, st(ln(10,20,58,20,30,62), arc(32,92,26,28,90,-150)))],                         // flat-top 3
  4: [G(72, ln(14,20,14,72,62,72), ln(52,20,52,120)), G(72, ln(46,20,8,88,66,88,46,88,46,120))],  // open 4; one stroke
  5: [G(70, ln(16,20,14,64), st(ln(14,64,30,60), arc(34,92,26,28,100,-150)), ln(16,20,58,20))],  // three strokes
  6: [G(72, st(arc(40,58,26,38,70,190), arc(38,94,24,26,180,540)))],
  7: [G(70, ln(8,20,62,20,26,120), ln(20,70,56,70)), G(70, ln(8,20,62,20,30,120))],           // with a bar; straighter
  8: [G(72, st(arc(36,44,22,24,0,270), arc(36,94,26,26,90,-270)))],                        // one-stroke 8
  9: [G(72, arc(34,46,24,26,0,360), ln(58,46,58,120)), G(72, st(arc(36,46,24,26,10,370), arc(28,90,30,30,0,-70)))],  // circle + stick; curly tail
};
// every model for a number (all combinations of the ways to write each digit)
function numberModels(v){
  let models = [[]], x = 0;
  for (const ch of String(v)){
    const forms = [DIGITS[ch], ...(DIGIT_ALTS[ch] || [])], next = [];
    let w = 0;
    for (const m of models) for (const g of forms){
      next.push(m.concat(g.s.map(s => s.map(([a, b]) => [a + x, b])))); w = Math.max(w, g.w);
    }
    models = next; x += w + 12;
  }
  return models;
}
const DIGIT_OPT = {r: 0.15, ang: 0.85, minSize: 6, extra: 2.5};   // gentler than letter grading
// how much his writing looks like number v (0..1); backwards (mirrored) numbers count too
function numberScore(ink, v){
  const mirror = ink.map(st => st.map(([x, y]) => [-x, y]));
  let best = 0;
  for (const m of numberModels(v)) for (const k of [ink, mirror]){
    const g = gradeWriting(k, m, DIGIT_OPT);
    if (g.score > best) best = g.score;
  }
  return best;
}
function inkSize(ink){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  ink.forEach(st => st.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
  return Math.max(x1 - x0, y1 - y0);
}
function numberStrokes(str){
  let x = 0; const out = [];
  for (const ch of String(str)){ const g = DIGITS[ch]; g.s.forEach(s => out.push(s.map(([a, b]) => [a + x, b]))); x += g.w + 12; }
  return out;
}
// read a handwritten number 0..maxN: the model it matches best
function readNumber(ink, maxN = 10){
  let best = {v: -1, score: 0};
  for (let v = 0; v <= maxN; v++){
    const g = gradeWriting(ink, numberStrokes(v));
    if (g.score > best.score) best = {v, score: g.score};
  }
  return best;
}
function mathProblem(n){
  const sub = n % 2 === 1;                       // + − + − … all the way through
  const max = Math.floor(n / 5) % 2 === 0 ? 5 : 10; // within 5, then within 10 (for both halves)
  if (sub){ const a = 2 + rand(max - 1), b = 1 + rand(a - 1); return {a, b, op: '−', ans: a - b}; }
  const a = 1 + rand(max - 1), b = 1 + rand(max - a);
  return {a, b, op: '+', ans: a + b};
}
function mathScene(p, e){
  if (p.op === '−'){
    const items = Array.from({length: p.a}, (_, i) => `<span class="obj ${i >= p.ans ? 'gone' : ''}">${e}</span>`).join('');
    return `<div class="group-wrap"><div class="group">${items}</div></div>`;
  }
  const g = n => `<div class="group-wrap"><div class="group">${Array.from({length: n}, () => `<span class="obj">${e}</span>`).join('')}</div><div class="group-num">${n}</div></div>`;
  return `${g(p.a)}<div class="op">+</div>${g(p.b)}<div class="op">=</div><div class="q">?</div>`;
}
const mathSay = p => p.op === '+'
  ? [`${NUM_EN[p.a]} plus ${NUM_EN[p.b]} equals?`, `${NUM_ZH[p.a]}加${NUM_ZH[p.b]}等于几？`]
  : [`${NUM_EN[p.a]} take away ${NUM_EN[p.b]}. How many are left?`, `${NUM_ZH[p.a]}减${NUM_ZH[p.b]}，还剩几个？`];
const mathYes = p => p.op === '+'
  ? [`${p.a} plus ${p.b} is ${p.ans}!`, `${NUM_ZH[p.a]}加${NUM_ZH[p.b]}等于${NUM_ZH[p.ans]}！`]
  : [`${p.a} take away ${p.b} is ${p.ans}!`, `${NUM_ZH[p.a]}减${NUM_ZH[p.b]}等于${NUM_ZH[p.ans]}！`];

/* a small handwriting pad; returns its strokes (lists of points) */
let penSeenGlobal = false;
function inkPad(el, onInk){
  const NS = 'http://www.w3.org/2000/svg';
  el.innerHTML = `<svg viewBox="0 0 110 140" preserveAspectRatio="xMidYMid meet">
    <line x1="-500" x2="600" y1="20" y2="20" class="ln"/><line x1="-500" x2="600" y1="70" y2="70" class="ln ln-mid"/>
    <line x1="-500" x2="600" y1="120" y2="120" class="ln ln-base"/><g class="t-ink"></g></svg>`;
  const svg = el.firstElementChild, inkG = svg.querySelector('.t-ink');
  let strokes = [], dr = null;
  const toLocal = e => { const m = svg.getScreenCTM().inverse(); return [m.a*e.clientX + m.c*e.clientY + m.e, m.b*e.clientX + m.d*e.clientY + m.f]; };
  const addPt = pt => {
    const last = dr.pts[dr.pts.length - 1];
    if (last && Math.hypot(pt[0] - last[0], pt[1] - last[1]) < 1) return;
    dr.pts.push(pt);
    dr.path.setAttribute('d', pathD(dr.pts) + (dr.pts.length === 1 ? ' l0.01 0' : ''));
  };
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeenGlobal = true;
    else if (e.pointerType === 'touch' && penSeenGlobal) return;
    if (dr || el.classList.contains('locked')) return;
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    const path = document.createElementNS(NS, 'path'); path.setAttribute('class', 'ink'); path.style.stroke = '#7048e8';
    inkG.appendChild(path);
    dr = {id: e.pointerId, path, pts: []}; addPt(toLocal(e));
  });
  svg.addEventListener('pointermove', e => {
    if (!dr || e.pointerId !== dr.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => addPt(toLocal(ev)));
  });
  const end = e => { if (!dr || e.pointerId !== dr.id) return; strokes.push(dr.pts); dr = null; onInk && onInk(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return { get strokes(){ return strokes; }, clear(){ strokes = []; inkG.innerHTML = ''; } };
}

function mathHome(){
  navigate(); curSection = 'math';
  const g = store.get('math.game', null), played = !!(g && g.d === todayKey());
  $app.innerHTML = `${wordsHeader('Math', '数学')}
    <main class="stage">
      <div class="cheer-card">
        <div class="wc-emoji">${played ? '✅' : '🧮'}</div>
        <p class="big-txt">${played ? `Today: ${g.score} / ${MATH_LEN}` : "Today's math game"}<span class="zh">${played ? `今天答对了${g.score}题` : '今天的数学游戏'}</span></p>
        <p class="sub-txt">${MATH_LEN} questions · easy → hard · last ${MATH_LEN - MATH_CHOICE}: write the answer ✏️<br>${MATH_LEN}道题 · 由易到难 · 后${MATH_LEN - MATH_CHOICE}道自己写答案</p>
        <button class="ok-btn chunky" id="goMath">${played ? '🔁 Play again' : '▶️ Start'}<span class="zh">${played ? '再玩一次' : '开始'}</span></button>
      </div>
    </main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  document.getElementById('goMath').onclick = () => { sfx.pop(); mathGame(); };
  say(played ? `You already did today's math. Great job!` : `Let's do today's math! ${MATH_LEN} questions.`,
      played ? '今天的数学做完了，真棒！' : `我们来做今天的数学吧！${MATH_LEN}道题。`);
}

function mathGame(){
  navigate(); curSection = 'math';
  $app.innerHTML = `${wordsHeader("Today's math", '今日数学')}<main id="stage" class="stage"></main>`;
  document.getElementById('homeBtn').onclick = () => { sfx.pop(); home(); };
  const stage = document.getElementById('stage');
  let n = 0, score = 0;
  const dots = () => `<div class="dots small">${Array.from({length: MATH_LEN}, (_, k) =>
    `<span class="${k < n ? 'past' : k === n ? 'now' : ''} ${k === MATH_CHOICE ? 'gap' : ''}"></span>`).join('')}</div>`;
  const next = () => { n++; n < MATH_LEN ? ask() : finish(); };
  function right(el, p){
    score++; sfx.yay(); burst(el); flyStar(el, 200);       // star as soon as he gets it right
    const [pe, pz] = pick(PRAISE), [ye, yz] = mathYes(p);
    say(`${pe} ${ye}`, `${pz}${yz}`);
    later(next, 2300);
  }
  function ask(){ n < MATH_CHOICE ? askChoice() : askWrite(); }

  function askChoice(){
    const p = mathProblem(n), e = pick(THINGS), [en, zh] = mathSay(p);
    const opts = nearbyNumbers(p.ans, 3, p.op === '+' ? 1 : 0, 10);
    stage.innerHTML = `${dots()}
      <div class="prompt"><button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
        <div class="prompt-text">${p.a} ${p.op} ${p.b} = ?<span class="zh">${zh}</span></div></div>
      <div class="scene">${mathScene(p, e)}</div>
      <div class="choices">${opts.map(x => `<button class="choice chunky" data-v="${x}">${x}<small>${NUM_ZH[x]}</small></button>`).join('')}</div>`;
    stage.querySelector('.speak').onclick = () => { sfx.pop(); say(en, zh); };
    say(en, zh);
    let locked = false;
    stage.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (locked || b.disabled) return;
      if (+b.dataset.v === p.ans){ locked = true; b.classList.add('right'); right(b, p); }
      else { b.classList.add('wrong'); b.disabled = true; sfx.oops(); say('Try again!', '再试一次！'); }
    });
  }

  function askWrite(){
    const p = mathProblem(n), e = pick(THINGS), [en, zh] = mathSay(p);
    let tries = 0, locked = false;
    stage.innerHTML = `${dots()}
      <div class="prompt"><button class="round chunky speak" aria-label="Say it again">${IC.speak}</button>
        <div class="prompt-text">Write the answer!<span class="zh">自己写答案！</span></div></div>
      <div class="write-row">
        <div class="eq">${p.a} ${p.op} ${p.b} =</div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="scene hint-scene" hidden>${mathScene(p, e)}</div>
      <div class="toolbar">
        <button class="round chunky" id="mHint" aria-label="Show pictures">${IC.bulb}</button>
        <button class="round chunky" id="mClear" aria-label="Erase">${IC.erase}</button>
        <button class="ok-btn chunky" id="mOk">✅ Check<span class="zh">检查</span></button>
      </div>`;
    const padEl = stage.querySelector('#pad'), okBtn = stage.querySelector('#mOk');
    const pad = inkPad(padEl, () => okBtn.classList.add('ready'));
    stage.querySelector('.speak').onclick = () => { sfx.pop(); say(`${en} Write the answer!`, `${zh}写出答案！`); };
    stage.querySelector('#mHint').onclick = () => { sfx.pop(); stage.querySelector('.hint-scene').hidden = false; };
    stage.querySelector('#mClear').onclick = () => { sfx.pop(); pad.clear(); okBtn.classList.remove('ready'); };
    say(`${en} Write the answer!`, `${zh}写出答案！`);
    okBtn.onclick = () => {
      if (locked) return;
      if (!pad.strokes.length) return say('Write your answer first!', '先写答案！');
      sfx.pop();
      // too small to read: ask for bigger, don't count it as a try
      if (inkSize(pad.strokes) < 22){ sfx.oops(); return say('Write it bigger!', '写大一点！'); }
      // lenient for little hands: right if it looks like the answer at least about as much as like any other number
      const mine = numberScore(pad.strokes, p.ans);
      let other = 0;
      for (let v = 0; v <= 10; v++) if (v !== p.ans) other = Math.max(other, numberScore(pad.strokes, v));
      const ok = mine >= 0.42 && mine >= other - 0.06;   // tested: ~96% of right answers accepted, ~6% of look-alike wrong ones
      if (ok){ locked = true; padEl.classList.add('locked', 'good'); okBtn.classList.remove('ready'); right(padEl, p); return; }
      tries++; sfx.oops(); okBtn.classList.remove('ready');
      if (tries < 2){
        padEl.classList.add('shake'); setTimeout(() => padEl.classList.remove('shake'), 450);
        stage.querySelector('.hint-scene').hidden = false;
        say("Hmm, let's try again. Count the pictures!", '嗯，再试一次，数一数图片！');
        pad.clear();
      } else {
        locked = true; padEl.classList.add('locked');
        padEl.insertAdjacentHTML('beforeend', `<div class="pad-ans">${p.ans}</div>`);
        const [ye, yz] = mathYes(p);
        say(`The answer is ${p.ans}. ${ye}`, `答案是${NUM_ZH[p.ans]}。${yz}`);
        later(next, 3200);
      }
    };
  }

  function finish(){
    const prev = store.get('math.game', null);
    const bestToday = prev && prev.d === todayKey() ? Math.max(prev.score, score) : score;
    store.set('math.game', {d: todayKey(), score: bestToday});
    logToday(e => { e.math = Math.max(e.math || 0, score); });
    later(() => taskBonus('math', stage.querySelector('.cheer-card')), 50);
    stage.innerHTML = `<div class="cheer-card">
      <div class="wc-emoji">${score >= 16 ? '🏆' : score >= 10 ? '🥈' : '💪'}</div>
      <p class="big-txt">${score} / ${MATH_LEN}<span class="zh">答对了${score}题</span></p>
      <p class="sub-txt">Today's math is done! ✅ 今天的数学完成了！</p>
      <button class="ok-btn chunky" id="toHome">🏠 Home<span class="zh">回家</span></button></div>`;
    sfx.yay(); burst(stage.querySelector('.cheer-card'));
    say(`You got ${score} out of ${MATH_LEN}! Today's math is done!`, `你答对了${score}题！今天的数学完成啦！`);
    document.getElementById('toHome').onclick = () => { sfx.pop(); home(); };
  }
  ask();
}
